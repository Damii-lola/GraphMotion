<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GraphMotion</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: #1a1a1c;
    --border: #2c2c30;
    --accent: #ff5c1a;
    --text: #f0f0f0;
    --muted: #8a8a90;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.3px;
  }
  header span {
    font-size: 12px;
    color: var(--muted);
    display: none; /* keep-alive pinger still runs and updates this element's
                       text underneath - just not shown to the user */
  }
  .main-row {
    flex: 1;
    display: flex;
    gap: 12px;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #videoPanel { flex: 2; align-items: center; justify-content: center; }
  #codePanel { flex: 1; }

  #videoWrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  video {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    background: #000;
  }
  .placeholder {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-track {
    width: 240px;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin: 14px auto 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  #progressPct {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #loadingStatus {
    font-size: 13px;
  }

  #codeOutput {
    flex: 1;
    overflow: auto;
    background: #101012;
    border-radius: 8px;
    padding: 10px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    color: #9be89b;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .status-line {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }

  .prompt-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .prompt-input-wrap {
    position: relative;
    flex: 1;
  }
  .prompt-bar textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: #101012;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 40px 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    line-height: 1.4;
    outline: none;
    resize: none;
    overflow-y: hidden;
    max-height: 120px; /* ~5 lines - auto-grow cap before it scrolls internally */
    transition: max-height 0.15s ease;
  }
  .prompt-bar textarea.expanded {
    max-height: 320px;
    overflow-y: auto;
  }
  .prompt-bar textarea:focus { border-color: var(--accent); }
  #expandPromptBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
  }
  #expandPromptBtn:hover { background: var(--border); color: var(--text); }
  .prompt-bar button.generate-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    height: 44px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .prompt-bar button.generate-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .error-box {
    background: #2a1414;
    border: 1px solid #5c2020;
    color: #ff9d9d;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    margin-top: 8px;
  }
  .edit-mode-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a2420;
    border: 1px solid #2f4a3d;
    color: #8fd9b6;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12.5px;
    margin-bottom: -4px;
  }
  #cancelEditBtn {
    background: transparent;
    border: none;
    color: #8fd9b6;
    cursor: pointer;
    font-size: 13px;
    padding: 2px 6px;
    border-radius: 6px;
  }
  #cancelEditBtn:hover { background: #2f4a3d; }

  /* --- Sidebar (Claude-style history panel) --- */
  body { flex-direction: row; padding: 0; }
  #appShell { display: flex; width: 100%; height: 100%; }
  #sidebar {
    width: 260px;
    flex-shrink: 0;
    background: #131314;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.2s ease;
  }
  #sidebar.collapsed { margin-left: -260px; }
  #sidebarHeader {
    padding: 14px;
    display: flex;
    gap: 8px;
  }
  #newPromptBtn {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  #newPromptBtn:hover { background: var(--panel); border-color: var(--accent); }
  #sidebarToggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 14px;
    flex-shrink: 0;
  }
  #sidebarToggle:hover { color: var(--text); border-color: var(--accent); }
  #historyList {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 8px;
  }
  .history-empty {
    color: var(--muted);
    font-size: 12px;
    padding: 12px;
    text-align: center;
  }
  .history-item {
    position: relative;
    padding: 10px 30px 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
    font-size: 13px;
    line-height: 1.4;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .history-item:hover { background: var(--panel); }
  .history-item.active { background: var(--panel); border: 1px solid var(--accent); }
  .history-item .h-time {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 2px;
  }
  .h-edit-count { color: var(--accent); }
  .history-item .h-status-failed { color: #ff9d9d; }
  .h-delete-btn {
    position: absolute;
    top: 8px;
    right: 6px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .history-item:hover .h-delete-btn { opacity: 1; }
  .h-delete-btn:hover {
    background: #3a1a1a;
    color: #ff6b6b;
  }
  #mainArea {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    height: 100vh;
    box-sizing: border-box;
  }
  #headerToggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 14px;
    margin-right: 4px;
    display: none; /* only shown when the sidebar is collapsed - see rule below */
  }
  #headerToggle:hover { color: var(--text); border-color: var(--accent); }
  /* #sidebar and #mainArea are siblings, #sidebar first - this shows
     the header's toggle button ONLY when the sidebar itself carries
     .collapsed, so there's never a redundant pair of toggle buttons
     visible at once (one in the sidebar, one in the header). */
  #sidebar.collapsed ~ #mainArea #headerToggle { display: inline-block; }
</style>
</head>
<body>

<div id="appShell">
  <div id="sidebar">
    <div id="sidebarHeader">
      <button id="sidebarToggle" title="Collapse sidebar">☰</button>
      <button id="newPromptBtn">+ New prompt</button>
    </div>
    <div id="historyList">
      <div class="history-empty">No prompts yet</div>
    </div>
  </div>

  <div id="mainArea">
<header>
  <div style="display:flex; align-items:center;">
    <button id="headerToggle" title="Toggle history">☰</button>
    <h1>GraphMotion</h1>
  </div>
  <span id="apiTarget"></span>
</header>

<div class="main-row">
  <div class="panel" id="videoPanel">
    <div id="videoWrap">
      <div class="placeholder" id="videoPlaceholder">
        Enter a prompt below to generate a video
      </div>
    </div>
  </div>

  <div class="panel" id="codePanel">
    <div class="panel-label">Code Preview (scene JSON)</div>
    <div id="codeOutput">// Waiting for a prompt...</div>
    <div class="status-line" id="statusLine"></div>
  </div>
</div>

<div class="edit-mode-banner" id="editModeBanner" style="display:none;">
  <span id="editModeText">✏️ Editing this video - describe your change</span>
  <button id="cancelEditBtn" title="Start a fresh video instead">✕</button>
</div>
<div class="prompt-bar">
  <div class="prompt-input-wrap">
    <textarea
      id="promptInput"
      rows="1"
      placeholder="e.g. why budgeting apps fail"
      autocomplete="off"
    ></textarea>
    <button id="expandPromptBtn" title="Expand">⤢</button>
  </div>
  <button id="generateBtn" class="generate-btn">Generate</button>
</div>
  </div>
</div>

<script>
  // Point this at your live Render backend.
  const API_BASE = "https://graphmotion.onrender.com";
  // GitHub Pages serves this as a PROJECT site at
  // damii-lola.github.io/GraphMotion/ - confirmed directly by the
  // person who actually owns the deployment, not assumed. "/GraphMotion"
  // is a permanent prefix on every URL this site ever has - every path
  // built or read anywhere on this page has to account for it.
  const BASE_PATH = "/GraphMotion";

  function buildJobUrl(jobId) {
    return `${BASE_PATH}/${jobId}`;
  }
  function buildRootUrl() {
    return BASE_PATH ? `${BASE_PATH}/` : "/";
  }

  const promptInput = document.getElementById("promptInput");
  const generateBtn = document.getElementById("generateBtn");
  const videoWrap = document.getElementById("videoWrap");
  const codeOutput = document.getElementById("codeOutput");
  const statusLine = document.getElementById("statusLine");
  const sidebar = document.getElementById("sidebar");
  const historyList = document.getElementById("historyList");
  document.getElementById("apiTarget").textContent = API_BASE;

  // Tracks which job (if any) the page is currently showing, so the
  // sidebar can highlight it and so a running poll can tell whether
  // it's still the job the user actually wants to see.
  let currentJobId = null;
  // Tracks the STATUS of whatever job currentJobId refers to - needed
  // to know whether the next submitted prompt should EDIT it (only
  // valid once a video has actually finished rendering) or start a
  // fresh one. Kept as a separate variable rather than re-deriving it
  // from the DOM each time, since it needs to be checked synchronously
  // right when the user hits Generate.
  let currentJobStatus = null;

  // Simple persisted anonymous id so the backend's free-tier daily
  // limit (per userId) works across page reloads during testing.
  function getUserId() {
    let id = localStorage.getItem("shortform_test_uid");
    if (!id) {
      id = "test-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("shortform_test_uid", id);
    }
    return id;
  }

  function setLoading(statusText) {
    videoWrap.innerHTML = `
      <div class="placeholder">
        <div class="spinner"></div>
        <div id="loadingStatus">${escapeHtml(statusText || "Starting...")}</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div id="progressPct">0%</div>
      </div>`;
    codeOutput.textContent = "// Waiting for Mistral to write scene JSON...";
    statusLine.textContent = "";
    generateBtn.disabled = true;
    generateBtn.textContent = "Generating...";
  }

  // Maps backend job status to a human label + a rough progress
  // percentage for the stages that don't have a real 0-100 value
  // (writing_scenes, uploading) so the bar always moves forward,
  // then switches to the real Revideo-reported percentage once
  // status is 'rendering'.
  function updateProgressUI(job) {
    const statusEl = document.getElementById("loadingStatus");
    const fillEl = document.getElementById("progressFill");
    const pctEl = document.getElementById("progressPct");
    if (!statusEl || !fillEl || !pctEl) return;

    let label = "Starting...";
    let pct = 0;

    switch (job.status) {
      case "queued":
        label = "Queued...";
        pct = 2;
        break;
      case "writing_scenes":
        label = "Mistral is writing the scene JSON...";
        pct = 8;
        break;
      case "rendering":
        label = "Rendering video...";
        // job.progress is a real 0-100 from Revideo once rendering starts.
        pct = 10 + Math.round((Number(job.progress) || 0) * 0.85); // maps 0-100 -> 10-95
        break;
      case "uploading":
        label = "Uploading to storage...";
        pct = 97;
        break;
      default:
        label = job.status;
    }

    statusEl.textContent = label;
    fillEl.style.width = `${pct}%`;
    pctEl.textContent = `${pct}%`;
  }

  function setError(message) {
    videoWrap.innerHTML = `<div class="placeholder">Generation failed.</div>
      <div class="error-box">${escapeHtml(message)}</div>`;
    statusLine.textContent = "";
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate";
  }

  // Shared display function - used both right after a fresh
  // generation finishes AND when loading a past job from the sidebar
  // or a direct URL visit, so there's exactly one place that renders
  // a job's result rather than two copies that could drift apart.
  function loadJobIntoView(job) {
    if (job.video_url) {
      videoWrap.innerHTML = `<video src="${job.video_url}" controls autoplay loop></video>`;
    } else if (job.status === "failed") {
      videoWrap.innerHTML = `<div class="placeholder">This generation failed${job.error ? ": " + escapeHtml(job.error) : "."}</div>`;
    } else {
      videoWrap.innerHTML = `<div class="placeholder">Job finished with status "${escapeHtml(job.status)}" but no video_url was returned.</div>`;
    }

    if (job.scene_json) {
      const full = JSON.stringify(job.scene_json, null, 2);
      const snippet = full.length > 600 ? full.slice(0, 600) + "\n\n... (truncated)" : full;
      codeOutput.textContent = snippet;
    } else {
      codeOutput.textContent = "// No scene JSON returned.";
    }

    statusLine.textContent = `status: ${job.status} · job id: ${job.id}`;
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate";
    promptInput.value = job.prompt || "";
    autoResizePromptInput();

    currentJobId = job.id;
    currentJobStatus = job.status;
    highlightActiveHistoryItem();
    updateEditModeUI();
  }

  // Resets the page to the empty "start a new prompt" state - the
  // sidebar's "+ New" button target, and what a direct visit to the
  // bare site root should show.
  function showFreshPromptState() {
    currentJobId = null;
    currentJobStatus = null;
    promptInput.value = "";
    autoResizePromptInput();
    videoWrap.innerHTML = `<div class="placeholder" id="videoPlaceholder">Enter a prompt below to generate a video</div>`;
    codeOutput.textContent = "// Waiting for a prompt...";
    statusLine.textContent = "";
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate";
    highlightActiveHistoryItem();
    updateEditModeUI();
    promptInput.focus();
  }

  // Fetches one job by id and displays it - used for sidebar clicks,
  // direct URL loads, and restoring state on back/forward navigation.
  // pushUrl controls whether this call itself should push a new
  // history entry (true for a user-initiated click; false when we're
  // just reacting to a URL that's already correct, e.g. on page load
  // or a popstate event).
  async function navigateToJob(jobId, pushUrl) {
    setLoading("Loading...");
    try {
      const res = await fetch(`${API_BASE}/api/jobs/${jobId}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Failed to load job (${res.status})`);

      if (pushUrl) history.pushState({ jobId }, "", buildJobUrl(jobId));
      currentJobId = jobId;
      currentJobStatus = data.job.status;
      updateEditModeUI();

      const job = data.job;
      const isTerminal = job.status === "done" || job.status === "failed";
      if (isTerminal) {
        loadJobIntoView(job);
      } else {
        // This job hasn't finished yet (queued/writing_scenes/
        // rendering) - resume the live progress UI instead of
        // treating a still-in-progress job as a finished one. Was
        // unconditionally calling loadJobIntoView here, which
        // produced a real, confirmed bug: visiting or refreshing a
        // job's URL while it was still generating showed "finished
        // with status writing_scenes but no video_url was returned"
        // instead of actually resuming the progress bar.
        updateProgressUI(job);
        promptInput.value = job.prompt || "";
        autoResizePromptInput();
        pollJob(jobId).catch((err) => setError(err.message || String(err)));
      }
    } catch (err) {
      setError(err.message || String(err));
    }
  }

  async function generate() {
    const prompt = promptInput.value.trim();
    if (!prompt) return;

    const editingParentId = isInEditMode() ? currentJobId : null;
    setLoading(editingParentId ? "Applying your edit..." : "Starting...");

    try {
      const body = { prompt, userId: getUserId() };
      if (editingParentId) body.parentJobId = editingParentId;

      const res = await fetch(`${API_BASE}/api/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `Request failed with status ${res.status}`);
      }

      // Adopt this job's dedicated URL right away, not just once it
      // finishes - so a page refresh mid-render still resumes showing
      // progress for the right job instead of losing it.
      currentJobId = data.job.id;
      currentJobStatus = data.job.status;
      updateEditModeUI(); // hide the banner while the edit itself is rendering
      history.pushState({ jobId: currentJobId }, "", buildJobUrl(currentJobId));
      loadHistory(); // the new job now exists - reflect it in the sidebar immediately

      await pollJob(data.job.id);
    } catch (err) {
      setError(err.message || String(err));
    }
  }

  function pollJob(jobId) {
    const POLL_INTERVAL_MS = 2000;
    // Backend's own worst-case budget, kept in sync with the actual
    // current backend numbers (this drifted stale once before - re-
    // verified against the real code, not copied forward blind):
    // generation itself now has a hard 6-minute outer timeout
    // (mistralClient.js), then rendering chunks at CHUNK_SIZE_SECONDS=3s
    // each with its own 4-minute safety timeout (longVideoOrchestrator.js)
    // - a real, working, TYPICAL render (a default ~12s video is 4
    // chunks) can legitimately take several minutes past generation
    // without anything being stuck. This does NOT need to cover the
    // absolute pathological worst case (every single chunk timing out
    // independently) - that scenario resolves to a real job.status
    // "failed" on its own (the backend's own per-chunk/per-generation
    // timeouts guarantee that), which this poll loop already detects
    // and surfaces immediately below, regardless of MAX_WAIT_MS. This
    // only needs to comfortably cover ordinary, still-succeeding-but-
    // slow operation. Giving up client-side while the backend is still
    // genuinely working just misreports a slow-but-working render as
    // failed (the job itself isn't lost - refreshing the page resumes
    // polling it - but the user sees a false error first).
    const MAX_WAIT_MS = 20 * 60 * 1000; // give up after 20 minutes
    const MAX_CONSECUTIVE_FAILURES = 5; // tolerate ~10s of blips (e.g. a server restart) before giving up
    const startedAt = Date.now();
    let consecutiveFailures = 0;

    return new Promise((resolve, reject) => {
      const tick = async () => {
        // The user may have navigated to a different job (or back to
        // a fresh prompt) while this poll was in flight - stop
        // updating the UI for a job that's no longer the one on
        // screen, rather than clobbering whatever they navigated to.
        if (currentJobId !== jobId) return resolve();

        try {
          const res = await fetch(`${API_BASE}/api/jobs/${jobId}`);

          if (!res.ok) {
            throw new Error(`Failed to fetch job status (${res.status})`);
          }

          const data = await res.json();
          consecutiveFailures = 0; // reset on any successful response

          const job = data.job;
          if (currentJobId !== jobId) return resolve();
          updateProgressUI(job);

          if (job.status === "done") {
            loadJobIntoView(job);
            loadHistory(); // status changed - refresh the sidebar entry
            return resolve();
          }
          if (job.status === "failed") {
            loadHistory(); // reflect the failure in the sidebar too
            return reject(new Error(job.error || "Generation failed"));
          }
          if (Date.now() - startedAt > MAX_WAIT_MS) {
            return reject(new Error("Timed out waiting for the video to finish rendering."));
          }

          setTimeout(tick, POLL_INTERVAL_MS);
        } catch (err) {
          // A single failed poll is often just a transient blip (e.g.
          // the server briefly restarting after a memory-related crash
          // mid-render) rather than the job actually failing - retry a
          // few times before giving up, instead of surfacing an error
          // on the very first hiccup.
          consecutiveFailures++;
          if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) {
            return reject(err);
          }
          const statusEl = document.getElementById("loadingStatus");
          if (statusEl) statusEl.textContent = "Connection hiccup, retrying...";
          setTimeout(tick, POLL_INTERVAL_MS);
        }
      };

      tick();
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // --- History sidebar --------------------------------------------------

  function timeAgo(isoString) {
    const diffMs = Date.now() - new Date(isoString).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.round(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.round(hours / 24);
    return `${days}d ago`;
  }

  // --- Thread grouping ------------------------------------------------
  // Every edit is still its own row in the database (so any past
  // version stays reachable), but the sidebar should show ONE entry
  // per conversation, not one per edit - otherwise "red car" -> "blue
  // car" -> "red background" shows up as three disconnected chats
  // instead of one thread you're iterating on, which is exactly the
  // "just work solely on that chat" complaint this exists to fix.
  function groupJobsIntoThreads(jobs) {
    // Groups directly by thread_id - no chain-walking. The old
    // version here walked parent_job_id links to find each job's
    // root, which was fragile: it silently broke if the job list was
    // ever paginated/truncated, or if any single link in a chain was
    // missing from the fetched set. Every job's thread_id is now set
    // once, directly, when it's created (inherited from its parent in
    // one step - see supabaseClient.js's createJob) so grouping here
    // is just "which jobs share a thread_id", nothing to traverse.
    const threadsById = {};
    jobs.forEach((job) => {
      const threadId = job.thread_id || job.id; // fallback for any pre-migration row
      if (!threadsById[threadId]) threadsById[threadId] = [];
      threadsById[threadId].push(job);
    });

    return Object.values(threadsById).map((threadJobs) => {
      const sorted = [...threadJobs].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      return {
        rootPrompt: sorted[0].prompt,
        latestJob: sorted[sorted.length - 1],
        jobIds: sorted.map((j) => j.id),
      };
    }).sort((a, b) => new Date(b.latestJob.created_at) - new Date(a.latestJob.created_at));
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API_BASE}/api/jobs?userId=${encodeURIComponent(getUserId())}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load history");
      renderHistory(data.jobs || []);
    } catch (err) {
      // A failed history load shouldn't block using the app - just
      // leave whatever was already in the sidebar (or the empty state).
      console.error("[loadHistory]", err);
    }
  }

  function renderHistory(jobs) {
    if (jobs.length === 0) {
      historyList.innerHTML = `<div class="history-empty">No prompts yet</div>`;
      return;
    }
    const threads = groupJobsIntoThreads(jobs);
    historyList.innerHTML = threads.map((thread) => {
      const latest = thread.latestJob;
      const label = latest.status === "failed" ? ' <span class="h-status-failed">(failed)</span>' : "";
      const editCount = thread.jobIds.length > 1 ? ` <span class="h-edit-count">· ${thread.jobIds.length} versions</span>` : "";
      return `
        <div class="history-item" data-job-id="${escapeHtml(latest.id)}" data-thread-ids="${thread.jobIds.map(escapeHtml).join(",")}">
          ${escapeHtml((thread.rootPrompt || "Untitled").slice(0, 60))}${label}
          <span class="h-time">${timeAgo(latest.created_at)}${editCount}</span>
          <button class="h-delete-btn" data-thread-ids="${thread.jobIds.map(escapeHtml).join(",")}" title="Delete this whole chat">🗑</button>
        </div>`;
    }).join("");

    historyList.querySelectorAll(".history-item").forEach((el) => {
      el.addEventListener("click", () => navigateToJob(el.dataset.jobId, true));
    });
    historyList.querySelectorAll(".h-delete-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        // Stop this click from also bubbling up to the parent
        // .history-item's own click handler, which would navigate to
        // the very thread the user is trying to delete.
        e.stopPropagation();
        deleteThread(btn.dataset.threadIds.split(","));
      });
    });
    highlightActiveHistoryItem();
  }

  async function deleteThread(jobIds) {
    const label = jobIds.length > 1 ? `this whole chat (${jobIds.length} versions)` : "this prompt";
    if (!confirm(`Delete ${label}? This can't be undone.`)) return;
    try {
      // groupJobsIntoThreads builds jobIds OLDEST-first (it needs that
      // order to find the root for the thread label) - deleting in
      // that order would try to delete a parent while a child still
      // references it via the self-referencing parent_job_id foreign
      // key and fail partway through. Reverse it here so deletion
      // actually goes newest-first, children before their parents.
      const deletionOrder = [...jobIds].reverse();
      for (const id of deletionOrder) {
        const res = await fetch(`${API_BASE}/api/jobs/${id}?userId=${encodeURIComponent(getUserId())}`, {
          method: "DELETE",
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to delete");
      }

      // If the currently-displayed job was part of the deleted thread,
      // don't leave a dead job on screen.
      if (jobIds.includes(currentJobId)) {
        showFreshPromptState();
        history.pushState({}, "", buildRootUrl());
      }
      loadHistory();
    } catch (err) {
      alert("Couldn't delete this prompt: " + (err.message || String(err)));
    }
  }

  function highlightActiveHistoryItem() {
    historyList.querySelectorAll(".history-item").forEach((el) => {
      // Match against every job in the thread, not just the latest -
      // if the user is looking at an older version within a thread
      // (reachable by a direct URL to that specific version), the
      // thread should still highlight as active, not silently show
      // nothing selected.
      const threadIds = (el.dataset.threadIds || "").split(",");
      el.classList.toggle("active", threadIds.includes(currentJobId));
    });
  }

  // --- Edit mode ---------------------------------------------------
  // Every prompt after the first one edits the currently-displayed
  // video instead of starting a new one from scratch - only possible
  // once that video has actually finished rendering (currentJobStatus
  // === "done"). Call this any time currentJobId/currentJobStatus
  // changes so the banner and placeholder text never drift out of
  // sync with what will actually happen on the next Generate click.
  const editModeBanner = document.getElementById("editModeBanner");
  const editModeText = document.getElementById("editModeText");

  function isInEditMode() {
    return !!currentJobId && currentJobStatus === "done";
  }

  function updateEditModeUI() {
    const editing = isInEditMode();
    editModeBanner.style.display = editing ? "flex" : "none";
    if (editing) {
      editModeText.textContent = "✏️ Editing this video - describe your change";
      promptInput.placeholder = "e.g. change the car to blue";
    } else {
      promptInput.placeholder = "e.g. why budgeting apps fail";
    }
  }

  document.getElementById("cancelEditBtn").addEventListener("click", () => {
    showFreshPromptState();
    history.pushState({}, "", buildRootUrl());
  });

  // --- Sidebar toggle -----------------------------------------------

  function toggleSidebar() {
    sidebar.classList.toggle("collapsed");
    localStorage.setItem("shortform_sidebar_collapsed", sidebar.classList.contains("collapsed") ? "1" : "0");
  }
  document.getElementById("sidebarToggle").addEventListener("click", toggleSidebar);
  document.getElementById("headerToggle").addEventListener("click", toggleSidebar);
  if (localStorage.getItem("shortform_sidebar_collapsed") === "1") {
    sidebar.classList.add("collapsed");
  }

  document.getElementById("newPromptBtn").addEventListener("click", () => {
    showFreshPromptState();
    history.pushState({}, "", buildRootUrl());
  });

  // --- Back/forward browser navigation -------------------------------
  // Handles the user clicking their browser's back/forward buttons
  // after navigating between jobs via the sidebar - without this, the
  // URL would change but the page content would stay frozen on
  // whatever was last displayed.
  window.addEventListener("popstate", () => {
    routeFromCurrentUrl(false);
  });

  // Reads whatever job id (if any) is in the current URL path and
  // shows the matching view - shared between the very first page
  // load and popstate events, so there's one place that decides what
  // a given URL means instead of two copies that could disagree.
  function routeFromCurrentUrl(pushUrl) {
    let path = location.pathname;
    if (BASE_PATH && path.startsWith(BASE_PATH)) {
      path = path.slice(BASE_PATH.length);
    }
    const jobId = path.replace(/^\/+|\/+$/g, "").trim();
    if (jobId) {
      navigateToJob(jobId, pushUrl);
    } else {
      showFreshPromptState();
    }
  }

  generateBtn.addEventListener("click", generate);
  promptInput.addEventListener("keydown", (e) => {
    // Enter submits, Shift+Enter inserts a real newline - the
    // standard convention for a multi-line prompt box (matches most
    // chat UIs), rather than Enter always submitting regardless of
    // whether the user wanted a line break.
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      generate();
    }
  });

  // --- Auto-growing textarea + manual expand toggle --------------------

  const expandBtn = document.getElementById("expandPromptBtn");
  const AUTO_MAX_HEIGHT = 120;
  const EXPANDED_MAX_HEIGHT = 320;

  function autoResizePromptInput() {
    promptInput.style.height = "auto";
    const cap = promptInput.classList.contains("expanded") ? EXPANDED_MAX_HEIGHT : AUTO_MAX_HEIGHT;
    promptInput.style.height = Math.min(promptInput.scrollHeight, cap) + "px";
  }

  promptInput.addEventListener("input", autoResizePromptInput);

  expandBtn.addEventListener("click", () => {
    const nowExpanded = promptInput.classList.toggle("expanded");
    expandBtn.textContent = nowExpanded ? "⤡" : "⤢";
    expandBtn.title = nowExpanded ? "Collapse" : "Expand";
    autoResizePromptInput();
    promptInput.focus();
  });

  // Undo the 404.html redirect trick, if this load came from one -
  // must run before routeFromCurrentUrl so it sees the real restored
  // path, not the temporary "?p=..." redirect URL.
  (function restoreCleanUrlFromRedirect() {
    const params = new URLSearchParams(location.search);
    const encodedPath = params.get("p");
    if (encodedPath === null) return;
    params.delete("p");
    const remainingSearch = params.toString();
    const cleanUrl = "/" + encodedPath + (remainingSearch ? "?" + remainingSearch : "") + location.hash;
    history.replaceState({}, "", cleanUrl);
  })();

  // Initial load: show whatever the URL actually points to (a
  // specific job, or the fresh-prompt state if it's just the root),
  // and populate the sidebar regardless.
  routeFromCurrentUrl(false);
  loadHistory();

  // --- Keep-alive pinger ---------------------------------------------
  // Render's free tier spins the service down after ~15 min of no
  // traffic, which means the NEXT real request eats a 30-60s cold-start
  // on top of generation time. This pings /health every 10 minutes to
  // keep it warm while this tab stays open.
  //
  // Limitation: only works while this page is open in a browser tab -
  // it is NOT a real uptime solution. For that, use an external cron
  // pinger (cron-job.org, UptimeRobot, or a scheduled GitHub Action)
  // that hits API_BASE + "/health" independently of any browser.
  const KEEP_ALIVE_INTERVAL_MS = 10 * 60 * 1000; // 10 minutes
  let keepAliveTimer = null;

  async function pingHealth() {
    try {
      const res = await fetch(`${API_BASE}/health`);
      const ok = res.ok;
      updateKeepAliveIndicator(ok ? "awake" : "error");
    } catch (err) {
      updateKeepAliveIndicator("error");
    }
  }

  function updateKeepAliveIndicator(state) {
    const el = document.getElementById("apiTarget");
    const dot = state === "awake" ? "🟢" : state === "error" ? "🔴" : "🟡";
    el.textContent = `${API_BASE} ${dot}`;
  }

  function startKeepAlive() {
    pingHealth(); // immediate ping on load
    keepAliveTimer = setInterval(pingHealth, KEEP_ALIVE_INTERVAL_MS);
  }

  // Pause pinging when the tab isn't visible to avoid pointless calls,
  // resume (with an immediate ping) when it becomes visible again.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(keepAliveTimer);
    } else {
      startKeepAlive();
    }
  });

  startKeepAlive();
</script>

</body>
</html>
