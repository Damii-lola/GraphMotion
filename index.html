<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Summary Saas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container">
    <input type="text" id="urlInput" placeholder="enter tiktok url" />
    <button id="summaryBtn">🎬 Create Summary (frame every 5s)</button>
    
    <!-- Preview area – shows either embed, summary video, or loading spinner -->
    <div id="preview" class="hidden"></div>

    <!-- Loading overlay (hidden by default) -->
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Processing your video... This may take a moment.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
