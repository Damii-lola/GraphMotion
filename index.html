<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GraphMotion</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: #1a1a1c;
    --border: #2c2c30;
    --accent: #ff5c1a;
    --text: #f0f0f0;
    --muted: #8a8a90;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.3px;
  }
  header span {
    font-size: 12px;
    color: var(--muted);
  }
  .main-row {
    flex: 1;
    display: flex;
    gap: 12px;
    min-height: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .panel-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  #videoPanel { flex: 2; align-items: center; justify-content: center; }
  #codePanel { flex: 1; }

  #videoWrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  video {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    background: #000;
  }
  .placeholder {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
  }
  .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #codeOutput {
    flex: 1;
    overflow: auto;
    background: #101012;
    border-radius: 8px;
    padding: 10px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.5;
    color: #9be89b;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .status-line {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }

  .prompt-bar {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px;
    display: flex;
    gap: 10px;
  }
  .prompt-bar input {
    flex: 1;
    background: #101012;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .prompt-bar input:focus { border-color: var(--accent); }
  .prompt-bar button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .prompt-bar button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .error-box {
    background: #2a1414;
    border: 1px solid #5c2020;
    color: #ff9d9d;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Shortform AI — Test Console</h1>
  <span id="apiTarget"></span>
</header>

<div class="main-row">
  <div class="panel" id="videoPanel">
    <div id="videoWrap">
      <div class="placeholder" id="videoPlaceholder">
        Enter a prompt below to generate a video
      </div>
    </div>
  </div>

  <div class="panel" id="codePanel">
    <div class="panel-label">Code Preview (scene JSON)</div>
    <div id="codeOutput">// Waiting for a prompt...</div>
    <div class="status-line" id="statusLine"></div>
  </div>
</div>

<div class="prompt-bar">
  <input
    id="promptInput"
    type="text"
    placeholder="e.g. why budgeting apps fail"
    autocomplete="off"
  />
  <button id="generateBtn">Generate</button>
</div>

<script>
  // Point this at your live Render backend.
  const API_BASE = "https://graphmotion.onrender.com";

  const promptInput = document.getElementById("promptInput");
  const generateBtn = document.getElementById("generateBtn");
  const videoWrap = document.getElementById("videoWrap");
  const codeOutput = document.getElementById("codeOutput");
  const statusLine = document.getElementById("statusLine");
  document.getElementById("apiTarget").textContent = API_BASE;

  // Simple persisted anonymous id so the backend's free-tier daily
  // limit (per userId) works across page reloads during testing.
  function getUserId() {
    let id = localStorage.getItem("shortform_test_uid");
    if (!id) {
      id = "test-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("shortform_test_uid", id);
    }
    return id;
  }

  function setLoading() {
    videoWrap.innerHTML = `
      <div class="placeholder">
        <div class="spinner"></div>
        Generating video… this can take a minute or two.
      </div>`;
    codeOutput.textContent = "// Waiting for Mistral to write scene JSON...";
    statusLine.textContent = "";
    generateBtn.disabled = true;
    generateBtn.textContent = "Generating...";
  }

  function setError(message) {
    videoWrap.innerHTML = `<div class="placeholder">Generation failed.</div>
      <div class="error-box">${escapeHtml(message)}</div>`;
    statusLine.textContent = "";
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate";
  }

  function setResult(job) {
    if (job.video_url) {
      videoWrap.innerHTML = `<video src="${job.video_url}" controls autoplay loop></video>`;
    } else {
      videoWrap.innerHTML = `<div class="placeholder">Job finished with status "${job.status}" but no video_url was returned.</div>`;
    }

    if (job.scene_json) {
      // Only show a partial snippet, per the "not fully, just a small part" request.
      const full = JSON.stringify(job.scene_json, null, 2);
      const snippet = full.length > 600 ? full.slice(0, 600) + "\n\n... (truncated)" : full;
      codeOutput.textContent = snippet;
    } else {
      codeOutput.textContent = "// No scene JSON returned.";
    }

    statusLine.textContent = `status: ${job.status} · job id: ${job.id}`;
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate";
  }

  async function generate() {
    const prompt = promptInput.value.trim();
    if (!prompt) return;

    setLoading();

    try {
      const res = await fetch(`${API_BASE}/api/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, userId: getUserId() }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `Request failed with status ${res.status}`);
      }

      setResult(data.job);
    } catch (err) {
      setError(err.message || String(err));
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  generateBtn.addEventListener("click", generate);
  promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") generate();
  });
</script>

</body>
</html>
