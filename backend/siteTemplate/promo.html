<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Archivo+Black&family=Oswald:wght@700&family=League+Gothic&family=Bowlby+One&family=Rubik:wght@900&family=Pacifico&family=Lobster&family=Caveat+Brush&family=Poppins:wght@800&family=Inter:wght@900&family=Playfair+Display:wght@900&family=Bricolage+Grotesque:wght@800&family=Fjalla+One&display=swap" rel="stylesheet">
<!--
  SmartClips PRODUCT PROMO. A 9-second motion-graphics spot for a physical product, in the style of the best social product promos:
  a real product hero on a vivid backdrop, giant kinetic type, ingredients flying in, patterns and rings, almost no words.
  Nothing here is a template: the AI designs every promo as a "motion script" (SITE.promo) made of primitives (sprites, text, shapes, scatter, patterns,
  camera moves) and this file just plays that script. Everything is a pure function of time t, so the recorder and the preview show identical frames.
  The backdrop is the GraphMotion board: vivid radial-gradient zones, one per beat, with a cubic-eased camera pan between them.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>window.SITE = /*__SITE_JSON__*/null;</script>
<script>
(() => {
