<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{TITLE}}</title>
<link rel="preload" as="image" href="images/hero.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --forge-deep: #0B1C2D;
    --aqua-core: #00A8A8;
    --clean-white: #F8FAFB;
    --charge-orange: #FF6B35;
    --mineral-gray: #6B7C8A;
    --recover-sage: #7BA05B;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; }
  body {
    background: var(--forge-deep);
    color: var(--clean-white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Bricolage Grotesque", -apple-system, sans-serif; font-weight: 700; }

  nav.top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; justify-content: space-between; align-items: center;
    padding: 26px clamp(20px, 5vw, 64px);
    mix-blend-mode: difference;
  }
  nav.top .logo { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.02em; color: #fff; }
  nav.top .tag { font-size: 11px; color: rgba(255,255,255,0.7); letter-spacing: 0.12em; text-transform: uppercase; }
  #progress { position: fixed; top: 0; left: 0; height: 2px; width: 0%; background: var(--aqua-core); z-index: 100; }

  /* ---------- The stage: ONE fixed full-viewport layer of real photographs
     that crossfade into each other, driven purely by scroll PROGRESS, not
     by scroll POSITION - the viewport itself never moves. This is the
     actual mechanism behind "feels like a video playing, not a page being
     scrolled": nothing here ever translates vertically; only opacity,
     filter and scale change. Each photo also enters through a "blueprint"
     state (desaturated, cyan-shifted, faint schematic grid) that resolves
     into full colour as it becomes dominant - a real construction reveal,
     not just a plain crossfade. */
  #stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .layer { position: absolute; inset: 0; opacity: 0; }
  .layer[data-img="hero"] { opacity: 1; } /* visible instantly, before any JS loads; JS takes over after */
  .layer-img {
    position: absolute; inset: -6%;
    background-size: cover; background-position: 50% 45%;
    animation: slowZoom 22s ease-in-out infinite alternate;
  }
  .layer[data-img="core"] .layer-img { background-image: url('images/core.webp'); animation-delay: -4s; }
  .layer[data-img="charge"] .layer-img { background-image: url('images/charge.webp'); background-position: 50% 30%; animation-delay: -9s; }
  .layer[data-img="recover"] .layer-img { background-image: url('images/recover.webp'); animation-delay: -14s; }
  .layer[data-img="hero"] .layer-img { background-image: url('images/hero.webp'); }
  @keyframes slowZoom { from { transform: scale(1.0); } to { transform: scale(1.09); } }
  /* Bug found via self-check: grayscale+sepia+hue-rotate composed on the
     photo itself rendered a murky green instead of a technical cyan -
     filter functions don't combine predictably. A flat cyan wash with
     mix-blend-mode:color gives direct, reliable control over the hue
     regardless of the source photo, independent of the desaturation
     (done on the image itself) and the grid lines (drawn on top of both). */
  .layer-tint {
    position: absolute; inset: 0; opacity: 0;
    background: rgb(70, 205, 205);
    mix-blend-mode: color;
  }
  .layer-grid {
    position: absolute; inset: 0; opacity: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(180,240,240,0.4) 0px, rgba(180,240,240,0.4) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(180,240,240,0.4) 0px, rgba(180,240,240,0.4) 1px, transparent 1px, transparent 48px);
    mix-blend-mode: screen;
  }
  /* WebGL background: 6 photos that flow into each other through per-pair
     shader transitions (iris dive, liquid rise, sun burst, streak pan, ink
     bleed). DOM layers above stay as the instant pre-JS hero + fallback. */
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  html.glbg .layer, html.glbg .stage-scrim { display: none; }
  .ghost {
    position: absolute; left: 0; top: 0; z-index: 1; white-space: nowrap; pointer-events: none; opacity: 0; will-change: transform, opacity;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; text-transform: uppercase; line-height: 0.8;
    font-size: clamp(120px, 27vw, 420px); letter-spacing: -0.03em; color: transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,0.30);
  }
  .ghost.ink { -webkit-text-stroke-color: rgba(11,28,45,0.26); }
  .stage-scrim {
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(180deg, rgba(6,14,22,0.22) 0%, rgba(6,14,22,0.24) 45%, rgba(6,14,22,0.94) 100%);
  }

  #smooth-wrapper { position: relative; z-index: 2; overflow: hidden; }
  section.beat {
    position: relative; min-height: 100vh;
    display: flex; align-items: flex-end;
    padding: 0 clamp(24px, 6vw, 72px) 9vh;
  }
  /* Bug found via self-check: each pinned section's own 100vh flow height
     stacks ON TOP OF its pin-spacer's scroll distance (measured live:
     mission's pin started at 1800px, not the expected 900px), so scrolling
     between beats included a real, visible "sliding past a viewport of
     empty space" phase - precisely the "feels like scrolling" problem
     this whole rebuild is meant to remove. Pulling every section but the
     first up by one viewport height cancels that duplicated space, so a
     section's pin engages the instant the previous one's hold ends, with
     nothing in between. */
  section.beat:not(#hero) { margin-top: -100vh; }
  .beat-inner { max-width: 720px; }
  .eyebrow, .beat-kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255,255,255,0.78); margin-bottom: 18px; opacity: 0;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--aqua-core); }
  #hero .beat-kicker[data-line="core"], .beat-kicker[data-line="core"] { color: #7FE3E0; }
  .beat-kicker[data-line="charge"] { color: #FFB088; }
  .beat-kicker[data-line="recover"] { color: #B7D89A; }

  h1.hero-title { font-size: clamp(40px, 7.4vw, 92px); line-height: 0.98; letter-spacing: -0.02em; margin: 0; color: #fff; }
  h1.hero-title .word { display: inline-block; overflow: hidden; padding-bottom: 0.08em; margin-bottom: -0.08em; }
  h2.beat-title { font-size: clamp(28px, 5vw, 58px); line-height: 1.04; color: #fff; margin: 0; opacity: 0; max-width: 680px; }
  p.beat-body { max-width: 500px; margin: 20px 0 0; font-size: clamp(15px, 1.65vw, 17px); line-height: 1.6; color: rgba(255,255,255,0.85); opacity: 0; }
  .beat-stats { display: flex; gap: clamp(18px, 4vw, 38px); margin-top: 28px; opacity: 0; flex-wrap: wrap; }
  .beat-stats .stat .num { font-family: "Bricolage Grotesque", sans-serif; font-size: clamp(19px, 2.4vw, 25px); font-weight: 700; color: #fff; }
  .beat-stats .stat .lbl { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.62); margin-top: 3px; }
  .scroll-cue {
    position: absolute; right: clamp(24px, 6vw, 72px); bottom: 40px; z-index: 2;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.6);
    display: flex; align-items: center; gap: 10px; opacity: 0;
  }
  .scroll-cue .line { width: 34px; height: 1px; background: rgba(255,255,255,0.5); }

  /* Text changes position beat to beat (side + height), and the 3D can on
     the stage always moves to the opposite side. */
  section.beat.pos-right { justify-content: flex-end; }
  section.beat.v-center { align-items: center; padding-bottom: 0; }
  section.beat.v-top { align-items: flex-start; padding-top: 17vh; padding-bottom: 0; }
  .side-scrim { position: absolute; inset: 0; z-index: 1; opacity: 0; }
  .side-scrim.left { background: linear-gradient(90deg, rgba(6,14,22,0.82) 0%, rgba(6,14,22,0.55) 38%, rgba(6,14,22,0) 68%); }
  .side-scrim.right { background: linear-gradient(270deg, rgba(6,14,22,0.82) 0%, rgba(6,14,22,0.55) 38%, rgba(6,14,22,0) 68%); }
  .light-scrim { position: absolute; inset: 0; z-index: 1; opacity: 0; }
  .light-scrim.left { background: linear-gradient(90deg, rgba(248,250,251,0.92) 0%, rgba(248,250,251,0.82) 45%, rgba(248,250,251,0) 92%); }
  .light-scrim.right { background: linear-gradient(270deg, rgba(248,250,251,0.92) 0%, rgba(248,250,251,0.82) 45%, rgba(248,250,251,0) 92%); }
  section.beat.tone-light h2.beat-title, section.beat.tone-light .beat-stats .stat .num { color: #0B1C2D; }
  section.beat.tone-light p.beat-body { color: #1E3446; }
  section.beat.tone-light .beat-kicker { color: #075E66; }
  section.beat.tone-light .beat-stats .stat .lbl { color: #3C5364; }
  #gl { display: none; }
  .ghost { display: none !important; }
  #glOld { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  section.beat.center { align-items: center; justify-content: flex-start; text-align: left; padding-bottom: 0; }
  section.beat.center .beat-inner { max-width: 600px; }
  .cta-btn {
    display: inline-block; margin-top: 32px; padding: 15px 34px; border-radius: 999px;
    background: var(--aqua-core); color: #04252A; font-weight: 700; font-size: 15px; text-decoration: none; opacity: 0;
  }
  footer.foot { position: relative; z-index: 2; text-align: center; padding: 36px 24px 56px; color: rgba(248,250,251,0.4); font-size: 12px; background: var(--forge-deep); }

  /* Phones: every beat's text sits in the lower part of the screen at full width, with a bottom scrim (dark or light) instead of side scrims. */
  @media (max-width: 760px) {
    section.beat, section.beat.v-center, section.beat.v-top, section.beat.center { align-items: flex-end; justify-content: flex-start; padding: 0 22px 8vh; text-align: left; }
    section.beat.pos-right { justify-content: flex-start; }
    .beat-inner, section.beat.center .beat-inner { max-width: 100%; }
    h1.hero-title { font-size: clamp(38px, 12vw, 56px); }
    h2.beat-title { font-size: clamp(26px, 8vw, 38px); }
    p.beat-body { font-size: 15px; margin-top: 14px; }
    .beat-stats { margin-top: 20px; gap: 22px; }
    .scroll-cue { display: none; }
    .side-scrim.left, .side-scrim.right { background: linear-gradient(0deg, rgba(6,14,22,0.9) 0%, rgba(6,14,22,0.72) 40%, rgba(6,14,22,0) 78%); }
    .light-scrim.left, .light-scrim.right { background: linear-gradient(0deg, rgba(248,250,251,0.95) 0%, rgba(248,250,251,0.85) 45%, rgba(248,250,251,0) 85%); }
    nav.top { padding: 18px 20px; }
  }
</style>
  html.glbg .layer, html.glbg .stage-scrim { display: none; }
</style>

<body>

<div id="progress"></div>
<nav class="top">
  <div class="logo" id="navLogo"></div>
  <div class="tag" id="navTag"></div>
</nav>

<div id="stage">
  <canvas id="bg"></canvas>
  <div class="layer" data-img="hero"><div class="layer-img"></div><div class="layer-tint"></div><div class="layer-grid"></div></div>
  <div class="stage-scrim"></div>
  <div class="side-scrim left"></div>
  <div class="side-scrim right"></div>
  <div class="light-scrim left"></div>
  <div class="light-scrim right"></div>
</div>

<div id="smooth-wrapper">
<div id="smooth-content"></div>
</div>

<script>
window.SITE = /*__SITE_JSON__*/null;
(function () {
  var S = window.SITE, root = document.documentElement;
  var esc = function (t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; };
  var lines = function (t) { return String(t == null ? "" : t).split(/\n|\|/).map(esc).join("<br>"); };
  // fonts + colours from the spec
  var fams = [S.theme.displayFont, S.theme.bodyFont].filter(Boolean);
  var link = document.createElement("link"); link.rel = "stylesheet";
  link.href = "https://fonts.googleapis.com/css2?" + fams.map(function (f) { return "family=" + f.replace(/ /g, "+") + (["Anton","UnifrakturCook","Bebas Neue"].indexOf(f) >= 0 ? "" : ":wght@400;700;800"); }).join("&") + "&display=swap";
  document.head.appendChild(link);
  document.getElementById("theme").textContent =
    ":root{--accent:" + S.theme.accent + ";--accent-ink:" + S.theme.accentInk + ";--bg:" + S.theme.bg + "}" +
    "body{background:var(--bg)}" +
    '.display,.nav-display,nav.top .logo,.beat-stats .stat .num,h1.hero-title,h2.beat-title{font-weight:' + (S.theme.displayWeight || 700) + ';font-family:"' + S.theme.displayFont + '",Impact,sans-serif}' +
    (S.theme.bodyFont ? 'p.beat-body,.beat-kicker,.eyebrow,.cta-btn,.beat-stats .stat .lbl,nav.top .tag{font-family:"' + S.theme.bodyFont + '",-apple-system,sans-serif}' : "") +
    (S.theme.upper ? "h1.hero-title,h2.beat-title{text-transform:uppercase;letter-spacing:.01em;line-height:1}" : "") +
    ".cta-btn{background:var(--accent);color:var(--accent-ink)}.eyebrow .dot{background:var(--accent)}#progress{background:var(--accent)}" +
    ".beat-kicker{color:var(--accent-light,var(--accent))}section.beat.tone-light .beat-kicker{color:var(--accent-dark,#111)}";
  root.style.setProperty("--accent-light", S.theme.accentLight || S.theme.accent);
  root.style.setProperty("--accent-dark", S.theme.accentDark || "#111");
  document.title = S.brand + " — " + S.tagline;
  document.getElementById("navLogo").textContent = S.brand.toUpperCase();
  document.getElementById("navTag").textContent = S.tagline;
  var hero = S.scenes[0], html = "";
  html += '<section class="beat" id="hero" data-beat data-key="hero"><div class="beat-inner">' +
    '<span class="eyebrow" data-reveal><span class="dot"></span>' + esc(hero.kicker || S.brand) + "</span>" +
    '<h1 class="hero-title display" id="heroTitle">' + String(hero.title).split(/\n|\|/).map(function (l) { return '<span class="word">' + esc(l) + "</span>"; }).join("<br>") + "</h1>" +
    '<p class="beat-body" data-reveal>' + esc(hero.body) + "</p></div>" +
    '<div class="scroll-cue" data-reveal><span class="line"></span>Scroll</div></section>';
  S.scenes.slice(1).forEach(function (sc, k, arr) {
    var last = k === arr.length - 1;
    var cls = "beat" + (last ? " center" : sc.align === "right" ? " pos-right" : "") + (!last && sc.valign === "center" ? " v-center" : "") + (!last && sc.valign === "top" ? " v-top" : "") + (sc.tone === "light" ? " tone-light" : "");
    html += '<section class="' + cls + '" data-beat data-key="' + esc(sc.id) + '"><div class="beat-inner">' +
      (sc.kicker ? '<span class="beat-kicker" data-reveal>' + esc(sc.kicker) + "</span>" : "") +
      '<h2 class="beat-title display" data-reveal>' + lines(sc.title) + "</h2>" +
      (sc.body ? '<p class="beat-body" data-reveal>' + esc(sc.body) + "</p>" : "") +
      (sc.stats && sc.stats.length ? '<div class="beat-stats" data-reveal>' + sc.stats.map(function (s) { return '<div class="stat"><div class="num">' + esc(s.n) + '</div><div class="lbl">' + esc(s.l) + "</div></div>"; }).join("") + "</div>" : "") +
      (last && S.cta ? '<a href="#" class="cta-btn" data-reveal>' + esc(S.cta) + "</a>" : "") +
      "</div></section>";
  });
  document.getElementById("smooth-content").innerHTML = html;
  var heroLayer = document.querySelector('.layer[data-img="hero"] .layer-img'); if (heroLayer) heroLayer.style.backgroundImage = "url('images/hero.webp')";
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollSmoother.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/SplitText.min.js"></script>
<script>
(function () {
  "use strict";
  gsap.registerPlugin(ScrollTrigger, ScrollSmoother, SplitText);

  // ---------- The crossfade/blueprint-resolve engine. Pure function of
  // overall scroll PROGRESS (never position) - this is what makes the
  // photos morph into each other instead of sliding, and what makes the
  // viewport read as static while a "film" plays behind it. Declared
  // BEFORE ScrollSmoother.create() below: a real bug found live was that
  // ScrollSmoother fires onUpdate synchronously during its own creation,
  // and that callback calls updateStage() - if updateStage (or the `let
  // STOPS` it reads) were declared afterward, that first call threw
  // "Cannot access before initialization" and silently aborted the rest
  // of this whole script, including the window.__jumpToProgress
  // assignment at the very end.
  const SEQUENCE = ["hero", "core", "charge", "recover", "hero"];
  let STOPS = [0, 0.335, 0.50, 0.665, 1.0]; // placeholder - replaced below with REAL measured section boundaries once the pins exist; guessed fractions here caused a dead zone with no text (mission's text never lined up with the image transition it was guessed against)
  const TRANSITION_START = 0.72; // hold steady for most of a segment, then morph into the next photo in the last ~28%
  const layers = {};
  document.querySelectorAll(".layer").forEach((el) => {
    layers[el.dataset.img] = { el, img: el.querySelector(".layer-img"), tint: el.querySelector(".layer-tint"), grid: el.querySelector(".layer-grid") };
  });
  function smoothstep01(t) { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); }
  // Interpolate every filter parameter by hand (rather than snapping
  // between two filter strings) so the blueprint really RESOLVES into the
  // photo over the transition instead of popping between two states.
  function blueprintFilter(resolveAmount) {
    if (resolveAmount >= 1) return "none";
    const g = 1 - resolveAmount;
    // Desaturate + harden only; the cyan itself comes from .layer-tint.
    return `grayscale(${g}) brightness(${1 + 0.12 * g}) contrast(${1 + 0.4 * g})`;
  }

  let BEATS = []; // progress fractions at which each beat (hero, mission, core, charge, recover, cta) starts, plus 1 at the end
  function pushScene(p) {
    if (BEATS.length < 2 || !window.__sceneUpdate) return;
    let i = BEATS.length - 2;
    for (let k = 0; k < BEATS.length - 1; k++) { if (p < BEATS[k + 1]) { i = k; break; } }
    const t = Math.max(0, Math.min(1, (p - BEATS[i]) / (BEATS[i + 1] - BEATS[i])));
    window.__sceneUpdate(i, t, p);
  }

  function updateStage(progress) {
    pushScene(progress);
    let segIdx = STOPS.length - 2;
    for (let i = 0; i < STOPS.length - 1; i++) { if (progress <= STOPS[i + 1]) { segIdx = i; break; } }
    const segLocal = smoothstep01((progress - STOPS[segIdx]) / (STOPS[segIdx + 1] - STOPS[segIdx]));
    const crossfade = smoothstep01((segLocal - TRANSITION_START) / (1 - TRANSITION_START));
    const fromKey = SEQUENCE[segIdx], toKey = SEQUENCE[segIdx + 1];

    if (document.documentElement.classList.contains("glbg")) return;
    Object.entries(layers).forEach(([key, layer]) => {
      let weight = 0;
      if (key === fromKey) weight = Math.max(weight, 1 - crossfade);
      if (key === toKey) weight = Math.max(weight, crossfade);
      layer.el.style.opacity = weight;
      if (key === toKey) {
        // Entering photo resolves from a blueprint/schematic state into
        // full colour as the crossfade completes - a real construction
        // reveal, not a plain dissolve.
        layer.img.style.filter = blueprintFilter(crossfade);
        layer.tint.style.opacity = Math.max(0, 1 - crossfade * 1.25);
        layer.grid.style.opacity = Math.max(0, 1 - crossfade * 1.4) * 0.6;
      } else {
        layer.img.style.filter = "none";
        layer.tint.style.opacity = 0;
        layer.grid.style.opacity = 0;
      }
    });
  }

  // totalStart/span are placeholders, replaced further down once all
  // pinned sections exist and the document's real length is known -
  // ScrollSmoother's own onUpdate is used to drive progress rather than a
  // second ScrollTrigger with numeric start/end, which was found live to
  // NOT behave as an absolute pixel range (it recomputed its own "end" to
  // 1008px regardless of the explicit value passed in) - ScrollSmoother's
  // own scrollTop() reading is the ground truth here instead.
  let totalStart = 0, span = 1;
  const smoother = ScrollSmoother.create({
    wrapper: "#smooth-wrapper", content: "#smooth-content", smooth: 0.9,
    onUpdate: (self) => {
      const p = Math.max(0, Math.min(1, (self.scrollTop() - totalStart) / span));
      gsap.set("#progress", { width: (p * 100) + "%" });
      updateStage(p);
    },
  });

  // ---------- Pinned beats: each section locks in place for a scroll span
  // and its OWN copy dissolves in/holds/dissolves out via a scrubbed
  // timeline - the section itself never slides, matching the photo stage.
  const heroSplit = new SplitText("#heroTitle .word", { type: "lines" });
  gsap.set(heroSplit.lines, { yPercent: 110, opacity: 0 });
  gsap.timeline({ delay: 0.3 })
    .to(heroSplit.lines, { yPercent: 0, opacity: 1, duration: 1.1, stagger: 0.12, ease: "power4.out" })
    .to("#hero [data-reveal]", { opacity: 1, duration: 0.8, stagger: 0.1, ease: "power2.out" }, "-=0.5");

  const PIN_DIST = "+=100%";
  const heroTl = gsap.timeline({ scrollTrigger: { trigger: "#hero", start: "top top", end: PIN_DIST, scrub: 0.5, pin: true, pinSpacing: true } })
    .to("#hero .beat-inner, #hero .scroll-cue", { opacity: 0, y: -40, duration: 0.4 }, 0.62);

  // Real boundaries, keyed by which photo should be fully resolved by the
  // time that section's pin begins (mission has no image of its own - it
  // shares hero's hold, so it isn't a key here). Storing the live
  // ScrollTrigger objects themselves, not their .start/.end read right
  // now - a real bug found live: reading .start/.end THIS early (before
  // ScrollTrigger.refresh() below) captured stale pre-refresh numbers,
  // which silently desynced totalStart/span from the real, final layout
  // and made every pinned section's own scrub timeline stop tracking the
  // (correct) scroll position __jumpToProgress was actually setting.
  const sectionTriggers = {};
  document.querySelectorAll("section.beat[data-beat]").forEach((sectionEl) => {
    if (sectionEl.id === "hero") return;
    const reveals = sectionEl.querySelectorAll("[data-reveal]");
    const isLast = sectionEl === document.querySelector("section.beat.center");
    gsap.set(reveals, { opacity: 0, y: 34 });
    const tl = gsap.timeline({
      scrollTrigger: { trigger: sectionEl, start: "top top", end: isLast ? "+=70%" : PIN_DIST, scrub: 0.5, pin: true, pinSpacing: true },
    });
