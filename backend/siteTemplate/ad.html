<!--
  SmartClips AD template. This is not a website: it is a 9:16 social-media ad that happens to be built in HTML so the
  recorder can film it. Everything below follows the marketing playbook in docs/AD_PLAYBOOK.md:
    - hook in the first frame, one idea per scene, <= 7 words of headline, big kinetic captions revealed word by word
    - key text lives in the platform safe zone (clear of the top 14%, the bottom 35% and the 6% side margins)
    - brand chip from the first second, logo end card + a real CTA in the last scene
    - story-style progress bars, sticker-style proof badges: the native social look, not the corporate-site look
-->
<style>
  :root { --accent: #ff5c1a; --accent-ink: #fff; --bg: #0b0b0d; --ink: #fff; --ink2: rgba(255,255,255,.95); --dispf: "Bricolage Grotesque", Impact, sans-serif; --dispw: 800; --bodyf: "Inter", -apple-system, sans-serif; --hs: 14vw; --ss: 4.6vw; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; background: var(--bg); }
  body { color: #fff; font-family: var(--bodyf); -webkit-font-smoothing: antialiased; }

  /* ---------- stage: one fixed WebGL layer that flows between the scene photographs */
  #stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg); }
  #fallback { position: absolute; inset: 0; background: center / cover no-repeat; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  html.glbg #fallback { display: none; }
  .scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #scrimD { opacity: 1; background: linear-gradient(180deg, rgba(6,9,14,.80) 0%, rgba(6,9,14,.72) 38%, rgba(6,9,14,.50) 62%, rgba(6,9,14,0) 88%); }
  #scrimL { opacity: 0; background: linear-gradient(180deg, rgba(250,251,252,.94) 0%, rgba(250,251,252,.86) 38%, rgba(250,251,252,.62) 62%, rgba(250,251,252,0) 88%); }

  /* ---------- social overlay: story progress bars + brand chip (both sit clear of the headline safe zone) */
  #segs { position: fixed; z-index: 6; top: 1.3vh; left: 6vw; right: 6vw; display: flex; gap: 1.4vw; pointer-events: none; }
  #segs i { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,.34); overflow: hidden; }
  #segs b { display: block; height: 100%; width: 0; background: #fff; }
  #chip { position: fixed; z-index: 6; top: 14.2vh; left: 6vw; display: flex; align-items: center; gap: 2.2vw; padding: .9vw 3.4vw .9vw .9vw; border-radius: 99px; background: rgba(10,12,16,.72); pointer-events: none; }
  #chip .av { width: 8.2vw; height: 8.2vw; border-radius: 50%; object-fit: cover; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font: 800 4.2vw/1 var(--dispf); }
  #chip .av.plate { background: #fff; object-fit: contain; padding: .8vw; }
  #chip .av.plate.dark { background: #0b0d12; }
  #chip .nm { font: 800 3.5vw/1 var(--bodyf); color: #fff; letter-spacing: .01em; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- scenes */
  #smooth-wrapper { position: relative; z-index: 2; overflow: hidden; }
  section.beat { position: relative; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: var(--pt, 22vh) 6vw 0; text-align: center; }
  section.beat:not(:first-child) { margin-top: -100vh; }  /* each pin engages the moment the previous one ends: no scroll gap */
  section.role-hook { --pt: 25vh; } section.role-pain { --pt: 22vh; } section.role-solution { --pt: 23vh; }
  section.role-feature { --pt: 22vh; } section.role-proof { --pt: 24vh; } section.role-cta { --pt: 20vh; }
  section.tone-light { --ink: #0b1420; --ink2: #1b2f42; }
  .ad-inner { width: 100%; display: flex; flex-direction: column; align-items: center; will-change: transform, opacity; }

  .tag { display: inline-block; padding: 1.5vw 3.8vw; border-radius: 99px; background: #fff; color: #0a0c10; font: 800 3.1vw/1 var(--bodyf); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 2.4vh; opacity: 0; box-shadow: 0 .8vw 0 rgba(0,0,0,.28); }
  .hl { margin: 0; font-family: var(--dispf); font-weight: var(--dispw); font-size: var(--hs); line-height: 1.04; letter-spacing: -.01em; color: var(--ink); text-shadow: 0 .05em 0 rgba(0,0,0,.30), 0 0 .55em rgba(0,0,0,.42); }
  section.tone-light .hl, section.tone-light .sub { text-shadow: 0 0 .5em rgba(255,255,255,.75); }
  /* every text is revealed WORD BY WORD: .w is the mask, .wi is the word that slides up through it */
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .05em .1em .14em; margin: -.05em -.1em -.14em; }
  .wi { display: inline-block; visibility: hidden; will-change: transform; } /* hidden until GSAP parks it below its mask (no CSS transform here: GSAP would read it back as pixels) */
  .w.hi .wi { background: var(--accent); color: var(--accent-ink); border-radius: .14em; padding: 0 .16em; text-shadow: none; }
  .sub { margin: 2.2vh 0 0; max-width: 94%; font-family: var(--bodyf); font-weight: 700; font-size: var(--ss); line-height: 1.24; color: var(--ink2); text-shadow: 0 .06em 0 rgba(0,0,0,.28), 0 0 .6em rgba(0,0,0,.45); }
  .sticker { margin-top: 3vh; opacity: 0; display: flex; align-items: center; gap: 3vw; padding: 1.5vh 5.2vw; border-radius: 3.2vw; background: var(--accent); color: var(--accent-ink); box-shadow: 0 1.3vw 0 rgba(0,0,0,.36); }
  .sticker .n { font-family: var(--dispf); font-weight: var(--dispw); font-size: 10vw; line-height: 1; }
  .sticker .l { font: 800 3.4vw/1.15 var(--bodyf); letter-spacing: .08em; text-transform: uppercase; text-align: left; max-width: 34vw; }

  /* end card */
  .cta-logo { width: 33vw; height: 33vw; border-radius: 26%; display: flex; align-items: center; justify-content: center; background: #fff; padding: 5vw; margin-bottom: 2.6vh; opacity: 0; box-shadow: 0 2vw 6vw rgba(0,0,0,.4); }
  .cta-logo.dark { background: #0b0d12; }
  .cta-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cta-word { margin-bottom: 2.4vh; opacity: 0; padding: 1.2vh 6vw; border-radius: 99px; background: #fff; color: #0a0c10; font: 800 6vw/1 var(--dispf); letter-spacing: .02em; }
  .cta-pulse { margin-top: 3.2vh; }
  .cta-btn { display: inline-flex; align-items: center; gap: 2.2vw; padding: 2.1vh 9vw; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font: 800 5.2vw/1 var(--bodyf); box-shadow: 0 1.4vw 0 rgba(0,0,0,.38); opacity: 0; text-decoration: none; }
  .cta-link { margin-top: 2vh; font: 800 4vw/1.2 var(--bodyf); color: var(--ink2); opacity: 0; text-shadow: 0 .06em 0 rgba(0,0,0,.3), 0 0 .6em rgba(0,0,0,.45); }
</style>
<style id="theme"></style>

  document.getElementById("chip").innerHTML = (logo ? '<img class="av plate ' + (logo.plate === "dark" ? "dark" : "") + '" src="' + esc(logo.file) + '" alt="">' : '<span class="av">' + esc(S.brand.charAt(0).toUpperCase()) + "</span>") + '<span class="nm">' + esc(S.brand) + "</span>";

})();
</script>
