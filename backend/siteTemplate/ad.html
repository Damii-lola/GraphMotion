<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>{{TITLE}}</title>
<link rel="preload" as="image" href="images/hook.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  SmartClips AD template. This is not a website: it is a 9:16 social-media ad that happens to be built in HTML so the
  recorder can film it. Everything below follows the marketing playbook in docs/AD_PLAYBOOK.md:
    - hook in the first frame, one idea per scene, <= 7 words of headline, big kinetic captions revealed word by word
    - key text lives in the platform safe zone (clear of the top 14%, the bottom 35% and the 6% side margins)
    - brand chip from the first second, logo end card + a real CTA in the last scene
    - story-style progress bars, sticker-style proof badges: the native social look, not the corporate-site look
-->
<style>
  :root { --accent: #ff5c1a; --accent-ink: #fff; --bg: #0b0b0d; --ink: #fff; --ink2: rgba(255,255,255,.95); --dispf: "Bricolage Grotesque", Impact, sans-serif; --dispw: 800; --bodyf: "Inter", -apple-system, sans-serif; --hs: 9vw; --ss: 3.5vw; }
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow-x: hidden; background: var(--bg); }
  body { color: #fff; font-family: var(--bodyf); -webkit-font-smoothing: antialiased; }

  /* ---------- stage: one fixed WebGL layer that flows between the scene photographs */
  #stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg); }
  #fallback { position: absolute; inset: 0; background: center / cover no-repeat; }
  #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  html.glbg #fallback { display: none; }
  #mv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; background: #000; }
  html.movie #scrimD { opacity: .55 !important; }
  html.movie #mv { display: block; } html.movie #bg, html.movie #fallback { display: none; }
  .scrim { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #scrimD { opacity: 1; background: linear-gradient(180deg, rgba(6,9,14,.80) 0%, rgba(6,9,14,.72) 38%, rgba(6,9,14,.50) 62%, rgba(6,9,14,0) 88%); }
  #scrimL { opacity: 0; background: linear-gradient(180deg, rgba(250,251,252,.94) 0%, rgba(250,251,252,.86) 38%, rgba(250,251,252,.62) 62%, rgba(250,251,252,0) 88%); }

  /* ---------- social overlay: story progress bars + brand chip (both sit clear of the headline safe zone) */
  #chip { position: fixed; z-index: 6; top: 2.2vh; left: 3.2vw; display: flex; align-items: center; gap: 2.2vw; padding: .9vw 3.4vw .9vw .9vw; border-radius: 99px; background: rgba(10,12,16,.72); pointer-events: none; }
  #chip .av { width: 8.2vw; height: 8.2vw; border-radius: 50%; object-fit: cover; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font: 800 4.2vw/1 var(--dispf); }
  #chip .av.plate { background: #fff; object-fit: contain; padding: .8vw; }
  #chip .av.plate.dark { background: #0b0d12; }
  #chip .nm { font: 800 3.5vw/1 var(--bodyf); color: #fff; letter-spacing: .01em; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- scenes. Each scene's text lives in the SAFE ZONE box (below the top 14-17%, above the bottom 34%, 6% side margins) and sits at one of four spots:
     mm = middle, bm = bottom centre, bl = bottom left, br = bottom right (bottom = the lower edge of the safe zone). */
  #scenes { position: fixed; inset: 0; z-index: 2; overflow: hidden; }
  section.beat { position: absolute; left: 6vw; right: 6vw; top: 17vh; bottom: 34vh; display: flex; }
  section.tone-light { --ink: #0b1420; --ink2: #1b2f42; }
  .ad-inner { display: flex; flex-direction: column; width: 100%; will-change: transform, opacity; }
  .pos-mm .ad-inner { margin: auto 0; align-items: center; text-align: center; }
  .pos-bm .ad-inner { margin: auto 0 0; align-items: center; text-align: center; }
  .pos-bl .ad-inner { margin: auto auto 0 0; width: 84%; align-items: flex-start; text-align: left; }
  .pos-br .ad-inner { margin: auto 0 0 auto; width: 84%; align-items: flex-end; text-align: right; }
  .pos-tl .ad-inner { margin: 0 auto auto 0; width: 84%; align-items: flex-start; text-align: left; }
  .pos-tm .ad-inner { margin: 0 0 auto; align-items: center; text-align: center; }

  .tag { display: inline-block; padding: 1.2vw 3vw; border-radius: 99px; background: #fff; color: #0a0c10; font: 800 2.5vw/1 var(--bodyf); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 2.4vh; opacity: 0; box-shadow: 0 .8vw 0 rgba(0,0,0,.28); }
  .hl { margin: 0; font-family: var(--dispf); font-weight: var(--dispw); font-size: var(--hs); line-height: 1.04; letter-spacing: -.01em; color: var(--ink); text-shadow: 0 .05em 0 rgba(0,0,0,.30), 0 0 .55em rgba(0,0,0,.42); }
  section.tone-light .hl, section.tone-light .sub { text-shadow: 0 0 .5em rgba(255,255,255,.75); }
  /* every text is revealed WORD BY WORD as one flowing wave: each word rises, un-blurs and settles (no hard-edged masks); a highlighted word gets its accent block WIPED in behind it */
  .w { display: inline-block; vertical-align: top; }
  .wi { display: inline-block; opacity: 0; }
  .w.hi .wi { background: linear-gradient(var(--accent), var(--accent)) no-repeat 0 0 / 0% 100%; border-radius: .14em; padding: 0 .16em; text-shadow: none; }
  .sub { margin: 2.2vh 0 0; max-width: 94%; font-family: var(--bodyf); font-weight: 700; font-size: var(--ss); line-height: 1.24; color: var(--ink2); text-shadow: 0 .06em 0 rgba(0,0,0,.28), 0 0 .6em rgba(0,0,0,.45); }
  .sticker { margin-top: 3vh; opacity: 0; display: flex; align-items: center; gap: 3vw; padding: 1.5vh 5.2vw; border-radius: 3.2vw; background: var(--accent); color: var(--accent-ink); box-shadow: 0 1.3vw 0 rgba(0,0,0,.36); }
  .sticker .n { font-family: var(--dispf); font-weight: var(--dispw); font-size: 6vw; line-height: 1; }
  .sticker .l { font: 800 3.4vw/1.15 var(--bodyf); letter-spacing: .08em; text-transform: uppercase; text-align: left; max-width: 34vw; }

  /* end card */
  .cta-logo { width: 33vw; height: 33vw; border-radius: 26%; display: flex; align-items: center; justify-content: center; background: #fff; padding: 5vw; margin-bottom: 2.6vh; opacity: 0; box-shadow: 0 2vw 6vw rgba(0,0,0,.4); }
  .cta-logo.dark { background: #0b0d12; }
  .cta-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .cta-word { margin-bottom: 2.4vh; opacity: 0; padding: 1.2vh 6vw; border-radius: 99px; background: #fff; color: #0a0c10; font: 800 6vw/1 var(--dispf); letter-spacing: .02em; }
  .cta-pulse { margin-top: 3.2vh; }
  .cta-btn { display: inline-flex; align-items: center; gap: 2.2vw; padding: 2.1vh 9vw; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font: 800 5.2vw/1 var(--bodyf); box-shadow: 0 1.4vw 0 rgba(0,0,0,.38); opacity: 0; text-decoration: none; }
  .cta-link { margin-top: 2vh; font: 800 4vw/1.2 var(--bodyf); color: var(--ink2); opacity: 0; text-shadow: 0 .06em 0 rgba(0,0,0,.3), 0 0 .6em rgba(0,0,0,.45); }
</style>
<style id="theme"></style>
</head>
<body>

<div id="stage">
  <div id="fallback"></div>
  <video id="mv" muted playsinline preload="auto"></video>
  <canvas id="bg"></canvas>
  <div class="scrim" id="scrimD"></div>
  <div class="scrim" id="scrimL"></div>
</div>
<div id="chip"></div>

<div id="scenes"></div>

<script>
window.SITE = /*__SITE_JSON__*/null;
(function () {
  var S = window.SITE, root = document.documentElement, N = S.scenes.length;
  var esc = function (t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; };
  /* text -> masked words. *marked words* get the accent highlight block, | or a newline breaks the line */
  var words = function (str) {
    var out = "", hi = false;
    String(str == null ? "" : str).replace(/\*([^*]+)\*([.,!?:;]+)/g, "*$1$2*").split(/(\*|\||\n)/).forEach(function (tok) {
      if (tok === "*") { hi = !hi; return; }
      if (tok === "|" || tok === "\n") { out += "<br>"; return; }
      tok.split(/\s+/).filter(Boolean).forEach(function (w) { out += '<span class="w' + (hi ? " hi" : "") + '"><span class="wi">' + esc(w) + "</span></span> "; });
    });
    return out;
  };
  var fams = [S.theme.displayFont, S.theme.bodyFont].filter(Boolean);
  var link = document.createElement("link"); link.rel = "stylesheet";
  link.href = "https://fonts.googleapis.com/css2?" + fams.map(function (f) { return "family=" + f.replace(/ /g, "+") + (["Anton", "UnifrakturCook", "Bebas Neue"].indexOf(f) >= 0 ? "" : ":wght@400;700;800"); }).join("&") + "&display=swap";
  document.head.appendChild(link);
  document.getElementById("theme").textContent =
    ':root{--accent:' + S.theme.accent + ';--accent-ink:' + S.theme.accentInk + ';--bg:' + S.theme.bg + ';--dispf:"' + S.theme.displayFont + '",Impact,sans-serif;--dispw:' + (S.theme.displayWeight || 800) + ';--bodyf:"' + (S.theme.bodyFont || "Inter") + '",-apple-system,sans-serif}' +
    (S.theme.upper ? ".hl{text-transform:uppercase;letter-spacing:.005em;line-height:1.02}" : "");
  document.title = S.brand + (S.tagline ? " — " + S.tagline : "");
  window.__audio = S.audio || null; // the recorder muxes this soundtrack into the video
  document.getElementById("fallback").style.backgroundImage = "url('images/hook.webp')";

  var logo = S.logo && S.logo.file ? S.logo : null;
  document.getElementById("chip").innerHTML = (logo ? '<img class="av plate ' + (logo.plate === "dark" ? "dark" : "") + '" src="' + esc(logo.file) + '" alt="">' : '<span class="av">' + esc(S.brand.charAt(0).toUpperCase()) + "</span>") + '<span class="nm">' + esc(S.brand) + "</span>";

  var html = "";
  S.scenes.forEach(function (sc, k) {
    var last = k === N - 1;
    html += '<section class="beat pos-' + esc(sc.pos || 'mm') + ' role-' + esc(sc.id) + (sc.tone === "light" ? " tone-light" : "") + '" data-beat data-key="' + esc(sc.id) + '"><div class="ad-inner">';

    else if (sc.tag) html += '<span class="tag">' + esc(sc.tag) + "</span>";
    html += "<" + (k ? "h2" : "h1") + ' class="hl">' + words(sc.headline) + "</" + (k ? "h2" : "h1") + ">";
    if (sc.sub) html += '<p class="sub">' + words(String(sc.sub).replace(/\*/g, "")) + "</p>";
    if (sc.sticker) html += '<div class="sticker"><span class="n">' + esc(sc.sticker.n) + '</span><span class="l">' + esc(sc.sticker.l) + "</span></div>";
    if (last) html += '<div class="cta-pulse"><a class="cta-btn" href="#">' + esc(S.cta) + ' <span aria-hidden="true">&rarr;</span></a></div>' + (S.link ? '<div class="cta-link">' + esc(S.link) + "</div>" : "");

})();
</script>

    if (lnk) master.fromTo(lnk, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.1, ease: "power2.out" }, i + 0.32);

  let playId = 0;

    if (window.__movie) {                                    // movie mode: the film plays natively, the captions follow its clock
      const v = window.__movie.video, my = ++playId; v.currentTime = 0; v.play().catch(() => {});

</script>

       continuous numbers chosen by the AI for THIS ad - where the camera dives (focus), how far it rushes (zoom), spin,
       motion blur, liquid warp, glow, colour split, edge softness, how long it lasts - plus an optional AI-written
       mask expression that shapes the opening. There is no list of transition types anywhere in this file.

const TRD = (i) => Object.assign({ focus: [0.5, 0.42], zoom: 0.9, spin: 0, blur: 0.5, warp: 0.3, glow: 0.3, chroma: 0.15, soft: 0.12, overlap: 0.4 }, TR[i] || {});
const FILM_S = N * 3.5;

const bgCanvas = document.getElementById("bg");
const bgr = new THREE.WebGLRenderer({ canvas: bgCanvas, antialias: false, alpha: false });
bgr.setPixelRatio(0.62);
const bgScene = new THREE.Scene(), bgCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blank = new THREE.DataTexture(new Uint8Array([11, 28, 45, 255]), 1, 1); blank.needsUpdate = true;
const bgTex = S.scenes.map(() => blank), bgAsp = S.scenes.map(() => 1);
let bgLoaded = 0, flowReady = false;
window.__assetsReady = () => bgLoaded >= N && flowReady && (!window.__fitDone || window.__fitDone());

// ---- AI-written mask expressions: sanitised on the server, and compile-tested here in isolation (a bad one falls back to the default opening, it can never break the film)
const gl = bgr.getContext();
function compiles(expr) {
  try {
    const sh = gl.createShader(gl.FRAGMENT_SHADER);
    gl.shaderSource(sh, "#version 300 es\nprecision highp float;\nfloat f(vec2 p, float q, float t){ return (" + expr + "); }\nout vec4 o; void main(){ o = vec4(f(vec2(0.1), 0.5, 1.0)); }");
    gl.compileShader(sh); const ok = !!gl.getShaderParameter(sh, gl.COMPILE_STATUS); gl.deleteShader(sh); return ok;
  } catch (e) { return false; }
}
const cases = TR.map((t, i) => (t && t.mask && compiles(t.mask) ? "if (k == " + i + ") return (" + t.mask + ");" : "")).join("\n  ");
window.__maskStatus = TR.map((t) => (t && t.mask ? compiles(t.mask) : null));

const FRAG = `
precision highp float;
uniform sampler2D uA; uniform sampler2D uB;
uniform vec2 uRes, uAsp, uLight, uF, uSeed; uniform float uT, uQ, uZoomB;
uniform vec4 uCamA, uCamB, uTr, uTr2, uFxA, uFxB; uniform vec3 uAcc;
varying vec2 vUv;
// uTr = (zoom, blur, warp, glow)   uTr2 = (chroma, spin, softness, transition index)
float maskExpr(int k, vec2 p, float q, float t){
  ${cases}
  return length(p) - (0.12 + 1.5 * q * q * (3.0 - 2.0 * q));
}
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), f.x), mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), f.x), f.y); }
float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int i = 0; i < 3; i++){ v += a * vnoise(p); p = p * 2.02 + vec2(17.3, 9.1); a *= 0.5; } return v; }
vec2 coverUV(vec2 uv, float ia){ float sa = uRes.x / uRes.y; vec2 s = sa > ia ? vec2(1.0, ia / sa) : vec2(sa / ia, 1.0); return (uv - 0.5) * s + 0.5; }
// screen -> image space for one camera: first the dive (scale + roll about the dive point), then the scene's own resting move about the screen centre
vec2 camUV(vec2 uv, vec4 c, float sc, float roll){
  float asp = uRes.x / uRes.y;
  vec2 p = (uv - uF) * vec2(asp, 1.0); float a = roll, cs = cos(a), sn = sin(a); p = vec2(cs * p.x - sn * p.y, sn * p.x + cs * p.y); p /= sc; p.x /= asp;
  vec2 q = (p + uF - 0.5) * vec2(asp, 1.0); a = c.w; cs = cos(a); sn = sin(a); q = vec2(cs * q.x - sn * q.y, sn * q.x + cs * q.y); q /= c.x; q.x /= asp;
  return q + 0.5 - c.yz;
}
vec3 tap(sampler2D t, vec2 uvi, float ia){ return texture2D(t, coverUV(uvi, ia)).rgb; }
vec3 still(sampler2D t, vec2 uvi, float ia, vec4 fx, float seed){   // a resting image: gentle water shimmer if the scene asks for it
  if (fx.x > 0.0){ vec2 w = vec2(vnoise(uvi * vec2(6.0, 14.0) + vec2(uT * 0.25, seed)), vnoise(uvi * vec2(9.0, 11.0) + vec2(seed, uT * 0.2))) - 0.5; uvi += w * 0.02 * fx.x; }
  return tap(t, uvi, ia);
}
float footprint(vec2 uvi, float ia){ vec2 c = coverUV(uvi, ia); vec2 d = min(c, 1.0 - c); return smoothstep(0.0, 0.03, min(d.x, d.y)); }
vec3 overlay(vec3 col, vec2 uv, vec4 fx, float seed, float light){
  float asp = uRes.x / uRes.y;
  if (fx.y > 0.0){ float m = fbm(uv * vec2(2.2, 3.2) + vec2(uT * 0.035, seed)); col = mix(col, mix(vec3(0.80, 0.90, 0.95), vec3(1.0), light), fx.y * smoothstep(0.38, 0.85, m) * 0.5); }
  if (fx.z > 0.0){ vec2 d = (uv - vec2(0.53, 0.5)) * vec2(asp, 1.0); float ang = atan(d.y, d.x);
    float r = vnoise(vec2(ang * 5.0 + uT * 0.10, seed)) * 0.7 + vnoise(vec2(ang * 11.0 - uT * 0.07, seed + 3.0)) * 0.3;
    col += mix(uAcc, vec3(1.0, 0.7, 0.4), 0.5) * pow(r, 2.2) * exp(-length(d) * 1.5) * fx.z * 0.8; }
  return col;
}
void main(){
  vec2 uv = vUv; float asp = uRes.x / uRes.y; float q = uQ; vec3 col; float m = 0.0;
  if (q <= 0.0005){
    col = still(uA, camUV(uv, uCamA, 1.0, 0.0), uAsp.x, uFxA, uSeed.x);
    col = overlay(col, uv, uFxA, uSeed.x, uLight.x);
  } else {
    float sp = sin(3.14159265 * q);
    float eo = 1.0 - pow(1.0 - q, 3.0);                                    // the incoming picture decelerates into its own resting move
    float scA = exp(uTr.x * q * q), scB = exp(-uZoomB * (1.0 - eo));       // the outgoing one accelerates away
    float rA = uTr2.y * q * q, rB = -uTr2.y * 0.6 * (1.0 - eo);
    vec2 pf = (uv - uF) * vec2(asp, 1.0);
    float dm = maskExpr(int(uTr2.w + 0.5), pf / scB, q, uT);
    dm = mix(max(dm, 0.35), dm, smoothstep(0.0, 0.08, q));                 // whatever the expression says, the opening starts closed...
    dm = mix(dm, -1.0, smoothstep(0.86, 1.0, q));                          // ...and is completely open by the end: no snap, ever
    float soft = uTr2.z; m = smoothstep(soft, -soft, dm);
    float edge = exp(-abs(dm) * 5.0) * sp;
    vec2 wv = (vec2(vnoise(uv * 5.0 + vec2(uT * 0.6, 0.0)), vnoise(uv * 5.0 + vec2(9.7, -uT * 0.5))) - 0.5) * uTr.z * 0.14 * edge;   // liquid warp, strongest on the edge of the opening
    float bl = uTr.y * sp, jit = hash(gl_FragCoord.xy);
    vec3 cA = vec3(0.0), cB = vec3(0.0);
    for (int k = 0; k < 8; k++){                                            // radial motion blur toward the dive point
      float f = (float(k) + jit) / 8.0, s = 1.0 - bl * 0.24 * f; vec2 uvs = uF + (uv + wv - uF) * s;
      cA += tap(uA, camUV(uvs, uCamA, scA, rA), uAsp.x);
      cB += tap(uB, camUV(uvs, uCamB, scB, rB), uAsp.y);
    }
    cA /= 8.0; cB /= 8.0;
    float box = footprint(camUV(uv + wv, uCamB, scB, rB), uAsp.y);         // while the incoming picture is smaller than the screen it is a window, not a smear
    m *= mix(1.0, box, 1.0 - smoothstep(0.35, 0.7, q));
    col = mix(cA, cB, m);
    if (uTr2.x > 0.0){                                                      // colour split, biggest at the fastest part of the dive
      vec2 ur = uF + (uv - uF) * (1.0 + uTr2.x * 0.010 * sp), ub = uF + (uv - uF) * (1.0 - uTr2.x * 0.010 * sp);
      vec3 cr = mix(tap(uA, camUV(ur, uCamA, scA, rA), uAsp.x), tap(uB, camUV(ur, uCamB, scB, rB), uAsp.y), m);
      vec3 cb = mix(tap(uA, camUV(ub, uCamA, scA, rA), uAsp.x), tap(uB, camUV(ub, uCamB, scB, rB), uAsp.y), m);
      col = vec3(cr.r, col.g, cb.b);
    }
    col += mix(uAcc, vec3(1.0), 0.45) * (edge * uTr.w * 0.9 + sp * sp * uTr.w * 0.10);   // bloom on the opening's edge + a breath of light through the whole dive
    col = overlay(col, uv, mix(uFxA, uFxB, m), mix(uSeed.x, uSeed.y, m), mix(uLight.x, uLight.y, m));
  }
  float lt = mix(uLight.x, uLight.y, m);
  col *= 1.0 - mix(0.42, 0.08, lt) * pow(length((uv - 0.5) * vec2(1.0, 0.9)) * 1.35, 2.0);
  gl_FragColor = vec4(col, 1.0);
}`;

const U = {
  uA: { value: blank }, uB: { value: blank }, uRes: { value: new THREE.Vector2(1, 1) }, uAsp: { value: new THREE.Vector2(1, 1) }, uLight: { value: new THREE.Vector2() },
  uF: { value: new THREE.Vector2(0.5, 0.42) }, uSeed: { value: new THREE.Vector2(1, 2) }, uT: { value: 0 }, uQ: { value: 0 }, uZoomB: { value: 0.5 },
  uCamA: { value: new THREE.Vector4(1, 0, 0, 0) }, uCamB: { value: new THREE.Vector4(1, 0, 0, 0) }, uTr: { value: new THREE.Vector4() }, uTr2: { value: new THREE.Vector4() },
  uFxA: { value: new THREE.Vector4() }, uFxB: { value: new THREE.Vector4() }, uAcc: { value: new THREE.Vector3(accRgb[0], accRgb[1], accRgb[2]) },
};
bgr.debug.onShaderError = (g, prog, vs, fs) => { console.error("flow shader failed:", g.getShaderInfoLog(fs)); };
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({ uniforms: U, vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }", fragmentShader: FRAG })));
const FX = S.scenes.map((s) => [s.fx.ripple, s.fx.mist, s.fx.rays, 0]), LIGHT = S.scenes.map((s) => (s.tone === "light" ? 1 : 0));

// a scene's own camera: a slow continuous move (push/pull + drift + roll) that is defined for ALL u, so the incoming scene is already moving while it opens
function camOf(k, u, T) {
  const m = MV[k], sway = 0.004 * Math.sin(T * 1.7 + k * 2.1);
  return [1.26 * Math.exp(1.5 * m.zoom * (u - 0.5)), 1.5 * m.pan[0] * (u - 0.5) + sway, 1.5 * m.pan[1] * (u - 0.5) + sway * 0.6, (1.5 * m.roll * (u - 0.5) * Math.PI) / 180];
}
let lastSize = "";
function draw(p) {
  const w = bgCanvas.clientWidth || window.innerWidth, h = bgCanvas.clientHeight || window.innerHeight;
  if (lastSize !== w + "x" + h) { lastSize = w + "x" + h; bgr.setSize(w, h, false); U.uRes.value.set(bgCanvas.width, bgCanvas.height); }
  p = clamp01(p);
  const P = Math.min(0.99999, p) * N, i = Math.min(N - 1, Math.floor(P)), u = P - i, last = i >= N - 1, nxt = Math.min(N - 1, i + 1), T = p * FILM_S;
  const tr = TRD(i), ov = last ? 0.4 : tr.overlap, q = last ? 0 : clamp01((u - (1 - ov)) / ov);
  const ca = camOf(i, u, T), cb = camOf(nxt, u - 1, T);
  U.uCamA.value.set(...ca); U.uCamB.value.set(...cb);
  U.uA.value = bgTex[i]; U.uB.value = bgTex[nxt]; U.uAsp.value.set(bgAsp[i], bgAsp[nxt]);
  U.uT.value = T; U.uQ.value = q; U.uZoomB.value = tr.zoom * 0.55;
  U.uF.value.set(tr.focus[0], 1 - tr.focus[1]);                    // spec focus is (x, y-from-top); GL is y-up
  U.uTr.value.set(tr.zoom, tr.blur, tr.warp, tr.glow); U.uTr2.value.set(tr.chroma, (tr.spin * Math.PI) / 180, tr.soft, i);
  U.uSeed.value.set(i * 3.7 + 1, nxt * 3.7 + 1); U.uFxA.value.set(...FX[i]); U.uFxB.value.set(...FX[nxt]); U.uLight.value.set(LIGHT[i], LIGHT[nxt]);
  const L = LIGHT[i] + (LIGHT[nxt] - LIGHT[i]) * sm(q * 1.4 - 0.2);
  scrimD.style.opacity = 1 - L; scrimLt.style.opacity = L;
  chip.style.opacity = last ? 0 : i === N - 2 ? 1 - sm((q - 0.2) / 0.6) : 1;                                       // the brand chip hands over to the end card
  if (pulse) pulse.style.transform = last ? "scale(" + (1 + 0.035 * Math.sin(u * 30)) + ")" : "none";               // the CTA breathes, deterministic in scene time
  if (window.__sceneUpdate) window.__sceneUpdate(i, u, p);
  bgr.render(bgScene, bgCam);
}
window.__setFrameHook(draw);   // every __jumpToProgress renders the background synchronously: no reliance on requestAnimationFrame
window.addEventListener("resize", () => draw(state.p));
S.scenes.forEach((sc, k) => {
  new THREE.TextureLoader().load("images/" + sc.id + ".webp", (t) => {
    t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.minFilter = THREE.LinearMipmapLinearFilter; t.anisotropy = 4;
    bgTex[k] = t; bgAsp[k] = t.image.width / t.image.height; bgLoaded++; draw(state.p);
  });
});
window.__sceneUpdate = (i, t, p) => { state.i = i; state.t = t; state.p = p; };
flowReady = true; window.__sceneReady = true;
draw(0);
}
</script>
</body></html>
