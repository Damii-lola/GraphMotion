<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartClips Studio</title>
<style>
  :root {
    --cream: #FBF2E6;
    --cream-soft: #F5E8D6;
    --card: #FFFCF7;
    --orange: #FF5C1A;
    --orange-dark: #E24E12;
    --orange-soft: #FFE4D2;
    --text: #2B1E13;
    --muted: #8A7460;
    --border: #EEDFC6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--cream);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    height: 100%;
    overflow-x: hidden;
  }

  /* Same faint-grid + soft-orange-glow background treatment as the
     landing page (index.html) - real, deliberate visual consistency
     across the whole product now that both share the SmartClips
     cream/orange identity, not just a coincidence of copy-paste. */
  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(43, 30, 19, 0.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(43, 30, 19, 0.045) 1px, transparent 1px);
    background-size: 42px 42px;
  }
  .bg-curve {
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(90px);
  }
  .bg-curve.c1 {
    width: 480px; height: 480px;
    top: -200px; right: -160px;
    background: radial-gradient(circle, var(--orange) 0%, transparent 70%);
    opacity: 0.22;
  }
  .bg-curve.c2 {
    width: 520px; height: 520px;
    bottom: -260px; left: -180px;
    background: radial-gradient(circle, #FFB27A 0%, transparent 70%);
    opacity: 0.2;
  }

  /* 100vh, then 100dvh right after as a progressive enhancement (an
     unsupported value is simply ignored, so this is a real fallback, not
     a bug) - real mobile browsers' 100vh includes space the address-bar/
     toolbar chrome is still occupying, so content sized to it can run a
     browser-chrome's-worth taller than what's actually visible (found on
     ai.html's own real mobile check - the prompt bar's own textarea
     placeholder was clipped at the bottom edge). 100dvh tracks the
     ACTUAL visible viewport instead. */
  #appShell { position: relative; z-index: 1; display: flex; width: 100%; height: 100vh; height: 100dvh; }
  /* Base (desktop) state: irrelevant and fully inert - only the mobile
     media query below gives this real positioning/visibility. Without
     this explicit base rule, a bare <div> defaults to display:block at
     every OTHER breakpoint too (harmless in practice here since it has
     no set height, but real, sloppy, and worth being explicit about). */
  #sidebarBackdrop { display: none; }

  /* ---------- Sidebar ("tabs" - your chat/prompt history) ---------- */
  #sidebar {
    width: 268px;
    flex-shrink: 0;
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: margin-left 0.2s ease;
  }
  #sidebar.collapsed { margin-left: -268px; }
  #sidebarHeader {
    padding: 16px 14px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #sidebarBrand {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: var(--text);
    margin-right: auto;
  }
  #sidebarBrand span { color: var(--orange); }
  #newPromptBtn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--orange);
    border: none;
    color: #fff;
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  #newPromptBtn:hover { background: var(--orange-dark); }
  #sidebarToggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    cursor: pointer;
    font-size: 14px;
  }
  #sidebarToggle:hover { color: var(--text); border-color: var(--orange); }
  #historyList {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 10px;
  }
  .history-empty {
    color: var(--muted);
    font-size: 12.5px;
    padding: 16px 8px;
    text-align: center;
  }
  .history-item {
    position: relative;
    padding: 11px 30px 11px 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 3px;
    font-size: 13px;
    line-height: 1.4;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: var(--text);
    border: 1px solid transparent;
  }
  .history-item:hover { background: var(--cream-soft); }
  .history-item.active { background: var(--orange-soft); border-color: #FFCBA3; }
  .history-item .h-time {
    display: block;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
  }
  .h-edit-count { color: var(--orange-dark); }
  .history-item .h-status-failed { color: #C0392B; }
  .h-delete-btn {
    position: absolute;
    top: 9px;
    right: 6px;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.12s ease, background 0.12s ease, color 0.12s ease;
  }
  .history-item:hover .h-delete-btn { opacity: 1; }
  .h-delete-btn:hover { background: #FBD9CB; color: #C0392B; }

  /* ---------- Main area ---------- */
  #mainArea {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 18px 22px;
    gap: 16px;
    height: 100vh;
    height: 100dvh; /* see #appShell's own doc comment above */
    box-sizing: border-box;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header .brand {
    font-size: 17px;
    font-weight: 800;
    margin: 0;
    letter-spacing: -0.2px;
    color: var(--text);
  }
  header .brand span { color: var(--orange); }
  header span#apiTarget {
    font-size: 12px;
    color: var(--muted);
    display: none; /* keep-alive pinger still runs and updates this element's
                       text underneath - just not shown to the user */
  }
  #headerToggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    font-size: 14px;
    margin-right: 10px;
    display: none; /* only shown when the sidebar is collapsed - see rule below */
    flex-shrink: 0;
  }
  #headerToggle:hover { color: var(--text); border-color: var(--orange); }
  #sidebar.collapsed ~ #mainArea #headerToggle { display: inline-block; }

  /* ---------- Video previewer ---------- */
  #videoPanel {
    flex: 1;
    min-height: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 24px 50px -32px rgba(43, 30, 19, 0.28);
  }
  #videoWrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  video {
    max-width: 100%;
    max-height: 100%;
    border-radius: 14px;
    background: #000;
    box-shadow: 0 20px 44px -20px rgba(43, 30, 19, 0.45);
  }
  .placeholder {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 24px;
    max-width: 320px;
  }
  .placeholder-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 18px;
    background: var(--orange-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress-track {
    width: 240px;
    height: 6px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin: 14px auto 6px;
  }
  .progress-fill {
    height: 100%;
    background: var(--orange);
    border-radius: 999px;
    transition: width 0.4s ease;
  }
  #progressPct {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #loadingStatus {
    font-size: 13.5px;
    color: var(--text);
    font-weight: 600;
  }

  .status-line {
    font-size: 11.5px;
    color: var(--muted);
    text-align: center;
    flex-shrink: 0;
  }

  /* ---------- Prompt bar ---------- */
  .prompt-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 12px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }
  .prompt-input-wrap {
    position: relative;
    flex: 1;
  }
  .prompt-bar textarea {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: var(--cream-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 40px 13px 15px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    line-height: 1.4;
    outline: none;
    resize: none;
    overflow-y: hidden;
    max-height: 120px;
    transition: max-height 0.15s ease, border-color 0.15s ease;
  }
  .prompt-bar textarea.expanded {
    max-height: 320px;
    overflow-y: auto;
  }
  .prompt-bar textarea:focus { border-color: var(--orange); }
  .prompt-bar textarea::placeholder { color: var(--muted); }
  #expandPromptBtn {
    position: absolute;
    top: 9px;
    right: 8px;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
  }
  #expandPromptBtn:hover { background: var(--border); color: var(--text); }
  .prompt-bar button.generate-btn {
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 24px;
    height: 46px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  .prompt-bar button.generate-btn:hover { background: var(--orange-dark); }
  .prompt-bar button.generate-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .prompt-bar button.cancel-btn {
    background: transparent;
    color: #C0392B;
    border: 1px solid #F0C4B8;
    border-radius: 12px;
    padding: 0 18px;
    height: 46px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .prompt-bar button.cancel-btn:hover { background: #FBE7E0; }
  .prompt-bar button.cancel-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .error-box {
    background: #FDECE8;
    border: 1px solid #F0BEB0;
    color: #B23A25;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12.5px;
    margin-top: 10px;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 860px) {
    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
      box-shadow: 20px 0 40px -20px rgba(43, 30, 19, 0.3);
    }
    #sidebar.collapsed { margin-left: -268px; }
    #sidebarBackdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(43, 30, 19, 0.35);
      z-index: 19;
    }
    #sidebar:not(.collapsed) ~ #sidebarBackdrop { display: block; }
    #mainArea { padding: 14px; }
    header .brand { font-size: 15px; }
    #headerToggle { display: inline-block !important; }
    .prompt-bar { flex-wrap: wrap; }
    .prompt-bar button.generate-btn { flex: 1; }
    .prompt-bar button.cancel-btn { flex: 1; }
  }

</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-curve c1"></div>
<div class="bg-curve c2"></div>

<div id="appShell">
  <div id="sidebar">
    <div id="sidebarHeader">
      <button id="sidebarToggle" title="Collapse sidebar">☰</button>
      <div id="sidebarBrand">Smart<span>Clips</span></div>
    </div>
    <div style="padding: 0 14px 10px;">
      <button id="newPromptBtn" style="width:100%; justify-content:center;">+ New prompt</button>
    </div>
    <div id="historyList">
      <div class="history-empty">No prompts yet</div>
    </div>
  </div>
  <div id="sidebarBackdrop"></div>

  <div id="mainArea">
<header>
  <div style="display:flex; align-items:center;">
    <button id="headerToggle" title="Toggle history">☰</button>
    <h1 class="brand">Smart<span>Clips</span> Studio</h1>
  </div>
  <span id="apiTarget"></span>
</header>

<div id="videoPanel">
  <div id="videoWrap">
    <div class="placeholder" id="videoPlaceholder">
      <div class="placeholder-icon">🎬</div>
      Enter a prompt below to generate a video
    </div>
  </div>
</div>
<div class="status-line" id="statusLine"></div>

<!-- Editing an already-finished video (isInEditMode/updateEditModeUI in
     the script below) is disabled, paired 1:1 with server.js's own
     disabled parentJobId handling - see that file's own doc comment.
     Left in the DOM (display:none, never toggled now that isInEditMode()
     is hardcoded false) rather than deleted, so both halves can be
     re-enabled together later without reconstructing this markup. -->
<div class="edit-mode-banner" id="editModeBanner" style="display:none;">
  <span id="editModeText">✏️ Editing this video - describe your change</span>
  <button id="cancelEditBtn" title="Start a fresh video instead">✕</button>
</div>
<div class="prompt-bar">
  <div class="prompt-input-wrap">
    <textarea
      id="promptInput"
      rows="1"
      placeholder="e.g. why budgeting apps fail"
      autocomplete="off"
    ></textarea>
    <button id="expandPromptBtn" title="Expand">⤢</button>
  </div>
  <button id="cancelBtn" class="cancel-btn" style="display:none;">Cancel</button>
  <button id="generateBtn" class="generate-btn">Generate</button>
</div>
  </div>
</div>

<script>
  // localStorage can genuinely throw (not just return null/undefined) in
  // real browser contexts - Safari private browsing being the most
  // common real-world case, not just this project's own file:// preview
  // tooling. One of these calls used to sit unguarded at the script's
  // own top level (the sidebar-collapsed check below) - a throw there
  // would have aborted the REST of this inline script, silently breaking
  // every event listener registered after it, not just the sidebar.
  // Small wrappers so a storage failure degrades to "use the default"
  // instead of taking the whole app down with it.
  function safeLocalStorageGet(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }
  function safeLocalStorageSet(key, value) {
    try { localStorage.setItem(key, value); } catch { /* best-effort only */ }
  }

  // Point this at your live Render backend.
  const API_BASE = "https://graphmotion.onrender.com";
  // GitHub Pages originally served this as a PROJECT site at
  // damii-lola.github.io/GraphMotion/, so BASE_PATH was "/GraphMotion" -
  // a permanent prefix every path built or read on this page had to
  // account for. Now "" (root): once a custom domain (smartclips.org)
  // is attached in GitHub's Pages settings, the SAME repo content is
  // served at the domain's own root instead, with no "/GraphMotion"
  // prefix at all. The `BASE_PATH &&` guard at this file's own
  // routeFromCurrentUrl/APP_PATH use sites already treats an empty
  // string as "no prefix to strip," so this is a safe, self-contained
  // change - see also 404.html's own matching BASE_PATH.
  const BASE_PATH = "";
  // This file used to BE index.html, living directly at BASE_PATH's own
  // root - moved to ai.html (2026-09-16) once index.html became the
  // public landing/register page instead. Every deep-link job URL
  // (BASE_PATH + "/" + jobId, handled via 404.html's own redirect-and-
  // restore trick - see that file's own doc comment) is left completely
  // unchanged on purpose: any link to a specific generated video that's
  // already been shared still resolves exactly the same way, just
  // falling through 404.html to THIS file now instead of the old
  // index.html. Only the "fresh/reset" case changes, since BASE_PATH's
  // own bare root is no longer this app at all.
  const APP_PATH = `${BASE_PATH}/ai.html`;

  function buildJobUrl(jobId) {
    return `${BASE_PATH}/${jobId}`;
  }
  function buildRootUrl() {
    return APP_PATH;
  }

  const promptInput = document.getElementById("promptInput");
  const generateBtn = document.getElementById("generateBtn");
  const cancelBtn = document.getElementById("cancelBtn");
  const videoWrap = document.getElementById("videoWrap");
  const statusLine = document.getElementById("statusLine");
  const sidebar = document.getElementById("sidebar");
  const historyList = document.getElementById("historyList");
  document.getElementById("apiTarget").textContent = API_BASE;

  // Tracks which job (if any) the page is currently showing, so the
  // sidebar can highlight it and so a running poll can tell whether
  // it's still the job the user actually wants to see.
  let currentJobId = null;
  // Tracks the STATUS of whatever job currentJobId refers to - needed
  // to know whether the next submitted prompt should EDIT it (only
  // valid once a video has actually finished rendering) or start a
  // fresh one. Kept as a separate variable rather than re-deriving it
  // from the DOM each time, since it needs to be checked synchronously
  // right when the user hits Generate.
  let currentJobStatus = null;
  // Guards generate() itself against being re-entered while a request
  // is already in flight - see generate()'s own comment for the real
  // production incident (repeated Enter presses, no guard, 5+
  // duplicate jobs) this closes. Reset in generate()'s own finally
  // block, so it can't get stuck true after an error.
  let isGenerating = false;
  // Real, confirmed-live bug (2026-09-09, direct user report: "my
  // internet went off, and it failed try it again"): when pollJob gives
  // up client-side (a network blip that outlasts MAX_CONSECUTIVE_FAILURES,
  // or the user's own connection dropping entirely), the backend job it
  // was watching is NEVER told to stop - it's a real forked render
  // process with no idea the client gave up, so it keeps rendering to
  // completion, orphaned. Confirmed directly via production logs: a
  // retried generation showed TWO interleaved sets of chunkWorker logs
  // (different pids, overlapping ranges) fighting over the same CPU,
  // each frame taking ~1.2-1.5s instead of the ~0.5s measured with only
  // one job running - the render wasn't slow, it was CONTENDED. This
  // flag tracks whether currentJobId's true server-side status is still
  // unknown (client gave up without ever hearing done/cancelled/failed)
  // - generate() uses it to cancel a stale orphaned job before starting
  // a fresh one, rather than letting both run concurrently. Deliberately
  // NOT applied to the "job is just slow" timeout path in pollJob (see
  // its own MAX_WAIT_MS comment) - that path's whole point is that
  // refreshing the page should still resume and eventually show the
  // finished video, which cancelling here would break.
  let currentJobMightBeOrphaned = false;

  // Best-effort - matches server.js's own cancelJobOnWorker convention
  // (fire-and-forget, never blocks the caller). Failing silently here is
  // fine: if this can't reach the server, the OLD job was orphaned
  // before this call too and this was never going to be reliable on its
  // own - the real fix is not creating a second concurrent job in the
  // first place, which is the caller's job, not this function's.
  function cancelOrphanedJob(jobId) {
    if (!jobId) return;
    fetch(`${API_BASE}/api/jobs/${jobId}/cancel?userId=${encodeURIComponent(getUserId())}`, { method: "POST" }).catch(() => {});
  }

  // Simple persisted anonymous id so the backend's free-tier daily
  // limit (per userId) works across page reloads during testing.
  function getUserId() {
    let id = safeLocalStorageGet("shortform_test_uid");
    if (!id) {
      id = "test-" + Math.random().toString(36).slice(2, 10);
      safeLocalStorageSet("shortform_test_uid", id);
    }
    return id;
  }

  function setLoading(statusText) {
    videoWrap.innerHTML = `
      <div class="placeholder">
        <div class="spinner"></div>
        <div id="loadingStatus">${escapeHtml(statusText || "Starting...")}</div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div id="progressPct">0%</div>
      </div>`;
    statusLine.textContent = "";
    generateBtn.disabled = true;
    generateBtn.textContent = "Generating...";
    cancelBtn.style.display = "inline-block";
    cancelBtn.disabled = false;
    cancelBtn.textContent = "Cancel";
  }

  // Maps backend job status to a human label + a rough progress
  // percentage for the stages that don't have a real 0-100 value
  // (writing_scenes, uploading) so the bar always moves forward,
  // then switches to the real Revideo-reported percentage once
  // status is 'rendering'.
  function updateProgressUI(job) {
    const statusEl = document.getElementById("loadingStatus");
    const fillEl = document.getElementById("progressFill");
    const pctEl = document.getElementById("progressPct");
    if (!statusEl || !fillEl || !pctEl) return;

    let label = "Starting...";
    let pct = 0;

    switch (job.status) {
      case "queued":
        label = "Queued...";
        pct = 2;
        break;
      case "writing_scenes":
        label = "Cloudflare AI is writing the scene...";
        pct = 8;
        break;
      case "rendering":
        label = "Rendering video...";
        // job.progress is a real 0-100 from Revideo once rendering starts.
        pct = 10 + Math.round((Number(job.progress) || 0) * 0.85); // maps 0-100 -> 10-95
        break;
      case "uploading":
        label = "Uploading to storage...";
        pct = 97;
        break;
      default:
        label = job.status;
    }

    statusEl.textContent = label;
    fillEl.style.width = `${pct}%`;
    pctEl.textContent = `${pct}%`;
  }

  function setError(message) {
    videoWrap.innerHTML = `<div class="placeholder">Generation failed.</div>
      <div class="error-box">${escapeHtml(message)}</div>`;
    statusLine.textContent = "";
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate";
    cancelBtn.style.display = "none";
  }

  // Shared display function - used both right after a fresh
  // generation finishes AND when loading a past job from the sidebar
  // or a direct URL visit, so there's exactly one place that renders
  // a job's result rather than two copies that could drift apart.
  function loadJobIntoView(job) {
    if (job.video_url) {
      videoWrap.innerHTML = `<video src="${job.video_url}" controls autoplay loop></video>`;
    } else if (job.status === "cancelled") {
      videoWrap.innerHTML = `<div class="placeholder">Generation cancelled.</div>`;
    } else if (job.status === "failed") {
      videoWrap.innerHTML = `<div class="placeholder">This generation failed${job.error ? ": " + escapeHtml(job.error) : "."}</div>`;
    } else {
      videoWrap.innerHTML = `<div class="placeholder">Job finished with status "${escapeHtml(job.status)}" but no video_url was returned.</div>`;
    }

    statusLine.textContent = `status: ${job.status} · job id: ${job.id}`;
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate";
    cancelBtn.style.display = "none";
    promptInput.value = job.prompt || "";
    autoResizePromptInput();

    currentJobId = job.id;
    currentJobStatus = job.status;
    highlightActiveHistoryItem();
    updateEditModeUI();
  }

  // Resets the page to the empty "start a new prompt" state - the
  // sidebar's "+ New" button target, and what a direct visit to the
  // bare site root should show.
  function showFreshPromptState() {
    // Same orphaned-job risk generate() itself guards against (see
    // currentJobMightBeOrphaned's own doc comment) - clicking "+ New
    // prompt" while a job is still rendering used to just drop the only
    // reference to it (currentJobId) with nothing to cancel it.
    if (currentJobId && currentJobMightBeOrphaned) {
      cancelOrphanedJob(currentJobId);
    }
    currentJobId = null;
    currentJobStatus = null;
    currentJobMightBeOrphaned = false;
    promptInput.value = "";
    autoResizePromptInput();
    videoWrap.innerHTML = `<div class="placeholder" id="videoPlaceholder"><div class="placeholder-icon">🎬</div>Enter a prompt below to generate a video</div>`;
    statusLine.textContent = "";
    generateBtn.disabled = false;
    generateBtn.textContent = "Generate";
    cancelBtn.style.display = "none";
    highlightActiveHistoryItem();
    updateEditModeUI();
    promptInput.focus();
  }

  // Fetches one job by id and displays it - used for sidebar clicks,
  // direct URL loads, and restoring state on back/forward navigation.
  // pushUrl controls whether this call itself should push a new
  // history entry (true for a user-initiated click; false when we're
  // just reacting to a URL that's already correct, e.g. on page load
  // or a popstate event).
  async function navigateToJob(jobId, pushUrl) {
    setLoading("Loading...");
    try {
      const res = await fetch(`${API_BASE}/api/jobs/${jobId}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Failed to load job (${res.status})`);

      if (pushUrl) history.pushState({ jobId }, "", buildJobUrl(jobId));
      currentJobId = jobId;
      currentJobStatus = data.job.status;
      updateEditModeUI();

      const job = data.job;
      const isTerminal = job.status === "done" || job.status === "failed" || job.status === "cancelled";
      currentJobMightBeOrphaned = !isTerminal; // see its own doc comment - navigating to a still-running job needs the same tracking generate()'s own fresh jobs get
      if (isTerminal) {
        loadJobIntoView(job);
      } else {
        // This job hasn't finished yet (queued/writing_scenes/
        // rendering) - resume the live progress UI instead of
        // treating a still-in-progress job as a finished one. Was
        // unconditionally calling loadJobIntoView here, which
        // produced a real, confirmed bug: visiting or refreshing a
        // job's URL while it was still generating showed "finished
        // with status writing_scenes but no video_url was returned"
        // instead of actually resuming the progress bar.
        updateProgressUI(job);
        promptInput.value = job.prompt || "";
        autoResizePromptInput();
        pollJob(jobId).catch((err) => setError(err.message || String(err)));
      }
    } catch (err) {
      setError(err.message || String(err));
    }
  }

  async function generate() {
    // Real, confirmed-live bug: this had no guard against being called
    // again while a generation was already in flight. The Enter-key
    // handler below calls generate() directly on every keydown with no
    // check of its own, and setLoading()'s generateBtn.disable=true
    // only blocks a SECOND click on the button - it does nothing to
    // stop the keydown path. A user pressing Enter more than once
    // (impatience, a stuck/repeated key, a double-tap) fired a fresh
    // POST /api/generate every single time, with nothing to stop it -
    // confirmed live via real production logs showing 5+ concurrent
    // jobs for the same prompt seconds apart, followed by the backend
    // crashing under that load and every in-flight request briefly
    // seeing it as a CORS/502 failure once it did. Guarding the
    // function itself (not just one call site) closes this for good,
    // regardless of what triggers generate() in the future.
    if (isGenerating) return;
    const prompt = promptInput.value.trim();
    if (!prompt) return;

    isGenerating = true;
    const editingParentId = isInEditMode() ? currentJobId : null;
    // See currentJobMightBeOrphaned's own doc comment above - this is
    // the actual fix for the concurrent-jobs-fighting-over-one-CPU
    // finding: starting a brand new generation (never true in edit mode,
    // since isInEditMode() already requires the prior job to be "done")
    // while the PREVIOUS attempt's true status is still unknown means it
    // may well still be rendering server-side. Cancel it first instead
    // of leaving it to run alongside the new one.
    if (!editingParentId && currentJobId && currentJobMightBeOrphaned) {
      cancelOrphanedJob(currentJobId);
    }
    setLoading(editingParentId ? "Applying your edit..." : "Starting...");

    try {
      const body = { prompt, userId: getUserId() };
      if (editingParentId) body.parentJobId = editingParentId;

      const res = await fetch(`${API_BASE}/api/generate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `Request failed with status ${res.status}`);
      }

      // Adopt this job's dedicated URL right away, not just once it
      // finishes - so a page refresh mid-render still resumes showing
      // progress for the right job instead of losing it.
      currentJobId = data.job.id;
      currentJobStatus = data.job.status;
      currentJobMightBeOrphaned = true; // cleared once pollJob confirms a real terminal status below
      updateEditModeUI(); // hide the banner while the edit itself is rendering
      history.pushState({ jobId: currentJobId }, "", buildJobUrl(currentJobId));
      loadHistory(); // the new job now exists - reflect it in the sidebar immediately

      await pollJob(data.job.id);
    } catch (err) {
      setError(err.message || String(err));
    } finally {
      // Always resets, success or failure - this flag intentionally
      // stays true for the WHOLE pollJob duration above (a full
      // generation can run several minutes), not just the initial
      // POST, since that's exactly the window a re-entrant call needs
      // to be blocked for.
      isGenerating = false;
    }
  }

  // Direct user request. currentJobId is whatever job the poll loop
  // above is currently watching - the very next tick after this call
  // resolves will see status "cancelled" on the backend (POST below
  // already wrote it) and route into loadJobIntoView's calm cancelled
  // message via pollJob's own status check, same path a real "done"
  // takes - no separate UI state to maintain here beyond disabling the
  // button while the request is in flight.
  async function cancelGeneration() {
    if (!currentJobId) return;
    cancelBtn.disabled = true;
    cancelBtn.textContent = "Cancelling...";
    try {
      const res = await fetch(`${API_BASE}/api/jobs/${currentJobId}/cancel?userId=${encodeURIComponent(getUserId())}`, {
        method: "POST",
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `Failed to cancel (${res.status})`);
    } catch (err) {
      cancelBtn.disabled = false;
      cancelBtn.textContent = "Cancel";
      setError(err.message || String(err));
    }
  }

  function pollJob(jobId) {
    const POLL_INTERVAL_MS = 2000;
    // Backend's own worst-case budget, kept in sync with the actual
    // current backend numbers (this drifted stale once before - re-
    // verified against the real code, not copied forward blind):
    // generation itself now has a hard 6-minute outer timeout
    // (mistralClient.js), then rendering chunks at CHUNK_SIZE_SECONDS=3s
    // each with its own 4-minute safety timeout (longVideoOrchestrator.js)
    // - a real, working, TYPICAL render (a default ~12s video is 4
    // chunks) can legitimately take several minutes past generation
    // without anything being stuck. This does NOT need to cover the
    // absolute pathological worst case (every single chunk timing out
    // independently) - that scenario resolves to a real job.status
    // "failed" on its own (the backend's own per-chunk/per-generation
    // timeouts guarantee that), which this poll loop already detects
    // and surfaces immediately below, regardless of MAX_WAIT_MS. This
    // only needs to comfortably cover ordinary, still-succeeding-but-
    // slow operation. Giving up client-side while the backend is still
    // genuinely working just misreports a slow-but-working render as
    // failed (the job itself isn't lost - refreshing the page resumes
    // polling it - but the user sees a false error first).
    const MAX_WAIT_MS = 20 * 60 * 1000; // give up after 20 minutes
    const MAX_CONSECUTIVE_FAILURES = 5; // tolerate ~10s of blips (e.g. a server restart) before giving up
    const startedAt = Date.now();
    let consecutiveFailures = 0;

    return new Promise((resolve, reject) => {
      const tick = async () => {
        // The user may have navigated to a different job (or back to
        // a fresh prompt) while this poll was in flight - stop
        // updating the UI for a job that's no longer the one on
        // screen, rather than clobbering whatever they navigated to.
        if (currentJobId !== jobId) return resolve();

        try {
          const res = await fetch(`${API_BASE}/api/jobs/${jobId}`);

          if (!res.ok) {
            throw new Error(`Failed to fetch job status (${res.status})`);
          }

          const data = await res.json();
          consecutiveFailures = 0; // reset on any successful response

          const job = data.job;
          if (currentJobId !== jobId) return resolve();
          updateProgressUI(job);

          if (job.status === "done") {
            currentJobMightBeOrphaned = false; // confirmed terminal - see its own doc comment
            loadJobIntoView(job);
            loadHistory(); // status changed - refresh the sidebar entry
            return resolve();
          }
          if (job.status === "cancelled") {
            currentJobMightBeOrphaned = false;
            // Not a failure - the user asked for this. loadJobIntoView
            // (not reject) so it gets the calm "Generation cancelled."
            // message rather than the red error box a rejection would
            // trigger in generate()'s own catch handler.
            loadJobIntoView(job);
            loadHistory();
            return resolve();
          }
          if (job.status === "failed") {
            currentJobMightBeOrphaned = false;
            loadHistory(); // reflect the failure in the sidebar too
            return reject(new Error(job.error || "Generation failed"));
          }
          if (Date.now() - startedAt > MAX_WAIT_MS) {
            return reject(new Error("Timed out waiting for the video to finish rendering."));
          }

          setTimeout(tick, POLL_INTERVAL_MS);
        } catch (err) {
          // A single failed poll is often just a transient blip (e.g.
          // the server briefly restarting after a memory-related crash
          // mid-render) rather than the job actually failing - retry a
          // few times before giving up, instead of surfacing an error
          // on the very first hiccup.
          consecutiveFailures++;
          if (consecutiveFailures >= MAX_CONSECUTIVE_FAILURES) {
            return reject(err);
          }
          const statusEl = document.getElementById("loadingStatus");
          if (statusEl) statusEl.textContent = "Connection hiccup, retrying...";
          setTimeout(tick, POLL_INTERVAL_MS);
        }
      };

      tick();
    });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // --- History sidebar --------------------------------------------------

  function timeAgo(isoString) {
    const diffMs = Date.now() - new Date(isoString).getTime();
    const mins = Math.round(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.round(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.round(hours / 24);
    return `${days}d ago`;
  }

  // --- Thread grouping ------------------------------------------------
  // Every edit is still its own row in the database (so any past
  // version stays reachable), but the sidebar should show ONE entry
  // per conversation, not one per edit - otherwise "red car" -> "blue
  // car" -> "red background" shows up as three disconnected chats
  // instead of one thread you're iterating on, which is exactly the
  // "just work solely on that chat" complaint this exists to fix.
  function groupJobsIntoThreads(jobs) {
    // Groups directly by thread_id - no chain-walking. The old
    // version here walked parent_job_id links to find each job's
    // root, which was fragile: it silently broke if the job list was
    // ever paginated/truncated, or if any single link in a chain was
    // missing from the fetched set. Every job's thread_id is now set
    // once, directly, when it's created (inherited from its parent in
    // one step - see supabaseClient.js's createJob) so grouping here
    // is just "which jobs share a thread_id", nothing to traverse.
    const threadsById = {};
    jobs.forEach((job) => {
      const threadId = job.thread_id || job.id; // fallback for any pre-migration row
      if (!threadsById[threadId]) threadsById[threadId] = [];
      threadsById[threadId].push(job);
    });

    return Object.values(threadsById).map((threadJobs) => {
      const sorted = [...threadJobs].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      return {
        rootPrompt: sorted[0].prompt,
        latestJob: sorted[sorted.length - 1],
        jobIds: sorted.map((j) => j.id),
      };
    }).sort((a, b) => new Date(b.latestJob.created_at) - new Date(a.latestJob.created_at));
  }

  async function loadHistory() {
    try {
      const res = await fetch(`${API_BASE}/api/jobs?userId=${encodeURIComponent(getUserId())}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load history");
      renderHistory(data.jobs || []);
    } catch (err) {
      // A failed history load shouldn't block using the app - just
      // leave whatever was already in the sidebar (or the empty state).
      console.error("[loadHistory]", err);
    }
  }

  function renderHistory(jobs) {
    if (jobs.length === 0) {
      historyList.innerHTML = `<div class="history-empty">No prompts yet</div>`;
      return;
    }
    const threads = groupJobsIntoThreads(jobs);
    historyList.innerHTML = threads.map((thread) => {
      const latest = thread.latestJob;
      const label = latest.status === "failed" ? ' <span class="h-status-failed">(failed)</span>' : "";
      const editCount = thread.jobIds.length > 1 ? ` <span class="h-edit-count">· ${thread.jobIds.length} versions</span>` : "";
      return `
        <div class="history-item" data-job-id="${escapeHtml(latest.id)}" data-thread-ids="${thread.jobIds.map(escapeHtml).join(",")}">
          ${escapeHtml((thread.rootPrompt || "Untitled").slice(0, 60))}${label}
          <span class="h-time">${timeAgo(latest.created_at)}${editCount}</span>
          <button class="h-delete-btn" data-thread-ids="${thread.jobIds.map(escapeHtml).join(",")}" title="Delete this whole chat">🗑</button>
        </div>`;
    }).join("");

    historyList.querySelectorAll(".history-item").forEach((el) => {
      el.addEventListener("click", () => {
        navigateToJob(el.dataset.jobId, true);
        closeSidebarOnMobile();
      });
    });
    historyList.querySelectorAll(".h-delete-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        // Stop this click from also bubbling up to the parent
        // .history-item's own click handler, which would navigate to
        // the very thread the user is trying to delete.
        e.stopPropagation();
        deleteThread(btn.dataset.threadIds.split(","));
      });
    });
    highlightActiveHistoryItem();
  }

  async function deleteThread(jobIds) {
    const label = jobIds.length > 1 ? `this whole chat (${jobIds.length} versions)` : "this prompt";
    if (!confirm(`Delete ${label}? This can't be undone.`)) return;
    try {
      // groupJobsIntoThreads builds jobIds OLDEST-first (it needs that
      // order to find the root for the thread label) - deleting in
      // that order would try to delete a parent while a child still
      // references it via the self-referencing parent_job_id foreign
      // key and fail partway through. Reverse it here so deletion
      // actually goes newest-first, children before their parents.
      const deletionOrder = [...jobIds].reverse();
      for (const id of deletionOrder) {
        const res = await fetch(`${API_BASE}/api/jobs/${id}?userId=${encodeURIComponent(getUserId())}`, {
          method: "DELETE",
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Failed to delete");
      }

      // If the currently-displayed job was part of the deleted thread,
      // don't leave a dead job on screen.
      if (jobIds.includes(currentJobId)) {
        showFreshPromptState();
        history.pushState({}, "", buildRootUrl());
      }
      loadHistory();
    } catch (err) {
      alert("Couldn't delete this prompt: " + (err.message || String(err)));
    }
  }

  function highlightActiveHistoryItem() {
    historyList.querySelectorAll(".history-item").forEach((el) => {
      // Match against every job in the thread, not just the latest -
      // if the user is looking at an older version within a thread
      // (reachable by a direct URL to that specific version), the
      // thread should still highlight as active, not silently show
      // nothing selected.
      const threadIds = (el.dataset.threadIds || "").split(",");
      el.classList.toggle("active", threadIds.includes(currentJobId));
    });
  }

  // --- Edit mode ---------------------------------------------------
  // Every prompt after the first one edits the currently-displayed
  // video instead of starting a new one from scratch - only possible
  // once that video has actually finished rendering (currentJobStatus
  // === "done"). Call this any time currentJobId/currentJobStatus
  // changes so the banner and placeholder text never drift out of
  // sync with what will actually happen on the next Generate click.
  const editModeBanner = document.getElementById("editModeBanner");
  const editModeText = document.getElementById("editModeText");

  // Editing an already-finished video is disabled (2026-09-16, direct
  // request), paired 1:1 with server.js's own disabled parentJobId
  // handling in POST /api/generate - a frontend that still offered this
  // banner while the backend silently ignored parentJobId and generated
  // an unrelated fresh video instead would be actively misleading, not
  // just an unused feature. Original condition kept as a comment so
  // re-enabling this is a one-line change, in both places, together.
  function isInEditMode() {
    // return !!currentJobId && currentJobStatus === "done";
    return false;
  }

  function updateEditModeUI() {
    const editing = isInEditMode();
    editModeBanner.style.display = editing ? "flex" : "none";
    if (editing) {
      editModeText.textContent = "✏️ Editing this video - describe your change";
      promptInput.placeholder = "e.g. change the car to blue";
    } else {
      promptInput.placeholder = "e.g. why budgeting apps fail";
    }
  }

  document.getElementById("cancelEditBtn").addEventListener("click", () => {
    showFreshPromptState();
    history.pushState({}, "", buildRootUrl());
  });

  // --- Sidebar toggle -----------------------------------------------

  function toggleSidebar() {
    sidebar.classList.toggle("collapsed");
    safeLocalStorageSet("shortform_sidebar_collapsed", sidebar.classList.contains("collapsed") ? "1" : "0");
  }
  document.getElementById("sidebarToggle").addEventListener("click", toggleSidebar);
  document.getElementById("headerToggle").addEventListener("click", toggleSidebar);
  // On mobile the sidebar is a full drawer overlay (see the @media rule
  // above), not a slim column sharing the layout - a first-time mobile
  // visitor with no saved preference yet should land on the actual video/
  // prompt UI, not an overlay covering most of it. An explicit saved
  // preference (from actually using the toggle before) always wins.
  const savedSidebarPref = safeLocalStorageGet("shortform_sidebar_collapsed");
  if (savedSidebarPref === "1" || (savedSidebarPref === null && window.innerWidth <= 860)) {
    sidebar.classList.add("collapsed");
  }
  // On mobile the sidebar is a fixed overlay (see the @media rule above),
  // not something that shares layout with #mainArea - clicking the dimmed
  // backdrop behind it, or picking a prompt/starting a fresh one, should
  // close it the same way a real drawer would, instead of leaving it
  // covering the video the user just navigated to.
  document.getElementById("sidebarBackdrop").addEventListener("click", () => {
    sidebar.classList.add("collapsed");
  });
  function closeSidebarOnMobile() {
    if (window.innerWidth <= 860) sidebar.classList.add("collapsed");
  }

  document.getElementById("newPromptBtn").addEventListener("click", () => {
    showFreshPromptState();
    closeSidebarOnMobile();
    history.pushState({}, "", buildRootUrl());
  });

  // --- Back/forward browser navigation -------------------------------
  // Handles the user clicking their browser's back/forward buttons
  // after navigating between jobs via the sidebar - without this, the
  // URL would change but the page content would stay frozen on
  // whatever was last displayed.
  window.addEventListener("popstate", () => {
    routeFromCurrentUrl(false);
  });

  // Reads whatever job id (if any) is in the current URL path and
  // shows the matching view - shared between the very first page
  // load and popstate events, so there's one place that decides what
  // a given URL means instead of two copies that could disagree.
  function routeFromCurrentUrl(pushUrl) {
    let path = location.pathname;
    if (BASE_PATH && path.startsWith(BASE_PATH)) {
      path = path.slice(BASE_PATH.length);
    }
    const jobId = path.replace(/^\/+|\/+$/g, "").trim();
    // A direct visit to this file's own real path (BASE_PATH + "/ai.html",
    // no 404-redirect trick involved - GitHub Pages just serves it
    // directly) leaves "ai.html" itself as the "jobId" after stripping
    // BASE_PATH - not a real job, just this app's own fresh/reset state.
    // Real, live-confirmed bug (2026-09-16, production error log:
    // `getJob failed: invalid input syntax for type uuid: "ai"`): a visit
    // to BASE_PATH + "/ai" (no .html extension - e.g. someone typing the
    // URL by hand, or a link that dropped the extension) goes through
    // 404.html's redirect-and-restore trick, which strips BASE_PATH the
    // same way and leaves bare "ai" as the "jobId" - only the literal
    // "ai.html" was ever guarded against, so this got treated as a real
    // job id and sent straight to a doomed getJob() lookup. Guard against
    // both spellings now.
    if (jobId && jobId !== "ai.html" && jobId !== "ai") {
      navigateToJob(jobId, pushUrl);
    } else {
      showFreshPromptState();
    }
  }

  generateBtn.addEventListener("click", generate);
  cancelBtn.addEventListener("click", cancelGeneration);
  promptInput.addEventListener("keydown", (e) => {
    // Enter submits, Shift+Enter inserts a real newline - the
    // standard convention for a multi-line prompt box (matches most
    // chat UIs), rather than Enter always submitting regardless of
    // whether the user wanted a line break.
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      generate();
    }
  });

  // --- Auto-growing textarea + manual expand toggle --------------------

  const expandBtn = document.getElementById("expandPromptBtn");
  const AUTO_MAX_HEIGHT = 120;
  const EXPANDED_MAX_HEIGHT = 320;

  function autoResizePromptInput() {
    promptInput.style.height = "auto";
    const cap = promptInput.classList.contains("expanded") ? EXPANDED_MAX_HEIGHT : AUTO_MAX_HEIGHT;
    promptInput.style.height = Math.min(promptInput.scrollHeight, cap) + "px";
  }

  promptInput.addEventListener("input", autoResizePromptInput);

  expandBtn.addEventListener("click", () => {
    const nowExpanded = promptInput.classList.toggle("expanded");
    expandBtn.textContent = nowExpanded ? "⤡" : "⤢";
    expandBtn.title = nowExpanded ? "Collapse" : "Expand";
    autoResizePromptInput();
    promptInput.focus();
  });

  // Undo the 404.html redirect trick, if this load came from one -
  // must run before routeFromCurrentUrl so it sees the real restored
  // path, not the temporary "?p=..." redirect URL.
  (function restoreCleanUrlFromRedirect() {
    const params = new URLSearchParams(location.search);
    const encodedPath = params.get("p");
    if (encodedPath === null) return;
    params.delete("p");
    const remainingSearch = params.toString();
    const cleanUrl = "/" + encodedPath + (remainingSearch ? "?" + remainingSearch : "") + location.hash;
    history.replaceState({}, "", cleanUrl);
  })();

  // Initial load: show whatever the URL actually points to (a
  // specific job, or the fresh-prompt state if it's just the root),
  // and populate the sidebar regardless.
  routeFromCurrentUrl(false);
  loadHistory();

  // --- Keep-alive pinger ---------------------------------------------
  // Render's free tier spins the service down after ~15 min of no
  // traffic, which means the NEXT real request eats a 30-60s cold-start
  // on top of generation time. This pings /health every 10 minutes to
  // keep it warm while this tab stays open.
  //
  // Limitation: only works while this page is open in a browser tab -
  // it is NOT a real uptime solution. For that, use an external cron
  // pinger (cron-job.org, UptimeRobot, or a scheduled GitHub Action)
  // that hits API_BASE + "/health" independently of any browser.
  const KEEP_ALIVE_INTERVAL_MS = 10 * 60 * 1000; // 10 minutes
  let keepAliveTimer = null;

  async function pingHealth() {
    try {
      const res = await fetch(`${API_BASE}/health`);
      const ok = res.ok;
      updateKeepAliveIndicator(ok ? "awake" : "error");
    } catch (err) {
      updateKeepAliveIndicator("error");
    }
  }

  function updateKeepAliveIndicator(state) {
    const el = document.getElementById("apiTarget");
    const dot = state === "awake" ? "🟢" : state === "error" ? "🔴" : "🟡";
    el.textContent = `${API_BASE} ${dot}`;
  }

  function startKeepAlive() {
    pingHealth(); // immediate ping on load
    keepAliveTimer = setInterval(pingHealth, KEEP_ALIVE_INTERVAL_MS);
  }

  // Pause pinging when the tab isn't visible to avoid pointless calls,
  // resume (with an immediate ping) when it becomes visible again.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearInterval(keepAliveTimer);
    } else {
      startKeepAlive();
    }
  });

  startKeepAlive();
</script>

</body>
</html>
