<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphMotion AI – Upload</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 GraphMotion AI</h1>
      <p>Upload your video – drag & drop or click to browse</p>
    </header>

    <!-- Drop zone -->
    <div id="dropZone" class="drop-zone">
      <div id="dropMessage">
        <p>📁 Drop your video here</p>
        <span>or click to select</span>
      </div>
      <input type="file" id="fileInput" accept="video/*" />
    </div>

    <!-- File name preview (after selection) -->
    <div id="fileInfo" class="file-info hidden">
      <span id="fileName"></span>
      <span id="fileSize"></span>
    </div>

    <div id="preview" class="hidden"></div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Uploading and processing your video...</p>
    </div>

    <footer>
      <p>Powered by Supabase</p>
    </footer>
  </div>
  <script src="ai-script.js"></script>
</body>
</html>
