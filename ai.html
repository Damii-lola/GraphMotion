<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphMotion AI – Upload</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- AWS SDK for multipart upload -->
  <script src="https://cdn.jsdelivr.net/npm/@aws-sdk/client-s3@3.504.0/dist/aws-sdk-client-s3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@aws-sdk/lib-storage@3.504.0/dist/aws-sdk-lib-storage.min.js"></script>
  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- FFmpeg.wasm UMD build (sets window.FFmpeg) -->
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 GraphMotion AI</h1>
      <p>Upload your video – drag & drop or click to browse</p>
    </header>

    <div id="dropZone" class="drop-zone">
      <div id="dropMessage">
        <p>📁 Drop your video here</p>
        <span>or click to select (max 1GB)</span>
      </div>
      <input type="file" id="fileInput" accept="video/*" />
    </div>

    <div id="compressToggle" class="compress-toggle hidden">
      <label>
        <input type="checkbox" id="useCompression" checked />
        ⚡ Compress before upload (recommended, saves bandwidth)
      </label>
    </div>

    <div id="fileInfo" class="file-info hidden">
      <span id="fileName"></span>
      <span id="fileSize"></span>
    </div>

    <!-- Upload progress with chunks -->
    <div id="progressArea" class="hidden">
      <div class="progress-header">
        <span id="progressText">0%</span>
        <span id="progressSpeed"></span>
      </div>
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
      </div>
      <div id="chunkGrid" class="chunk-grid"></div>
      <button id="cancelUploadBtn" class="btn-cancel hidden">Cancel Upload</button>
    </div>

    <div id="preview" class="hidden"></div>

    <div id="processArea" class="hidden">
      <button id="processBtn" class="btn-primary">🧠 Find Interesting Moments</button>
    </div>

    <div id="clipSelection" class="hidden">
      <h3>🎯 Select the most interesting clip:</h3>
      <div id="clipList" class="clip-list"></div>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p id="loadingMessage">Processing...</p>
    </div>

    <footer>
      <p>Powered by Supabase</p>
    </footer>
  </div>
  <script src="ai-script.js"></script>
</body>
</html>
