<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphMotion AI – Upload</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 GraphMotion AI</h1>
      <p>Upload your video – drag & drop or click to browse</p>
    </header>

    <div id="dropZone" class="drop-zone">
      <div id="dropMessage">
        <p>📁 Drop your video here</p>
        <span>or click to select (max 1GB)</span>
      </div>
      <input type="file" id="fileInput" accept="video/*" />
    </div>

    <div id="fileInfo" class="file-info hidden">
      <span id="fileName"></span>
      <span id="fileSize"></span>
    </div>

    <div id="progressArea" class="hidden">
      <div class="progress-bar">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
      </div>
      <p id="progressText">0%</p>
    </div>

    <div id="preview" class="hidden"></div>

    <div id="processArea" class="hidden">
      <button id="processBtn" class="btn-primary">🧠 Find Interesting Moments</button>
    </div>

    <div id="clipSelection" class="hidden">
      <h3>🎯 Select the most interesting clip:</h3>
      <div id="clipList" class="clip-list"></div>
    </div>

    <div id="aiResult" class="hidden">
      <h3>AI-Generated Script</h3>
      <div id="scriptOutput" class="script-output"></div>
    </div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p id="loadingMessage">Processing...</p>
    </div>

    <footer>
      <p>Powered by Supabase</p>
    </footer>
  </div>
  <script src="ai-script.js"></script>
</body>
</html>
